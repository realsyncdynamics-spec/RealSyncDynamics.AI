name: List Edge Functions

on:
  workflow_dispatch:

jobs:
  list:
    name: List all deployed Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # CLI v3 (seit 2026-11-02) zielt ohne --remote auf den lokalen Stack und
          # bricht hosted-Aenderungen ohne --yes ab ("Nothing was changed"). Bis zur
          # v3-Migration auf die letzte v2 festgeschrieben, kein `latest`.
          version: 2.122.1

      - name: List functions
        run: |
          set -euo pipefail
          echo "=== Deployed Edge Functions ==="
          supabase functions list --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          echo ""
          echo "=== Count ==="
          supabase functions list --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" | wc -l
