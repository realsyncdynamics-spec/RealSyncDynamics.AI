name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy explicitly selected edge functions?'
        type: boolean
        default: false
      function_names:
        description: 'Comma-separated existing slugs, maximum 12; required when deploy_functions=true'
        type: string
        default: ''
      push_migrations:
        description: 'Explicitly apply database migrations? Requires separate production approval.'
        type: boolean
        default: false

# Nur von main: workflow_dispatch läuft sonst mit dem Stand eines beliebigen
# Branches und schreibt dessen Migrationen und Functions nach Prod
# (Feature-Matrix Phase 1, Befund 7). Der Wächter verhindert Versehen; gegen
# einen absichtlich veränderten Workflow auf einem Branch schützt nur eine
# GitHub-Environment-Regel („Deployment branches: main“) in den Repo-Settings.
jobs:
  db-push:
    name: Push migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # R1 (Phase 0, 18.11.2026): Prod-Wirkung nur nach Freigabe in der GitHub-Environment `production`.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Identify migration-only deploy scope (fail closed)
        id: migrate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_MIGRATIONS: ${{ inputs.push_migrations }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MANUAL_MIGRATIONS" != "true" ]; then
              echo "apply=false" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch did not authorize DB migrations." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "Explicit migration dispatch requested; review owner approval." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT_NAME" != "push" ] || [ -z "$PUSH_BEFORE" ] || ! git cat-file -e "$PUSH_BEFORE^{commit}"; then
            echo "::error::Unknown push base: never run db push on an unverified range."
            exit 1
          fi
          changes="$(git diff --name-status --no-renames "$PUSH_BEFORE" HEAD -- supabase/migrations/)"
          if [ -z "$changes" ]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "No migration file changes; database push skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if printf '%s\n' "$changes" | grep -vE '^A[[:space:]]+supabase/migrations/[^[:space:]]+\.sql$'; then
            echo "::error::Non-append-only migration change: block automated db push."
            exit 1
          fi
          echo "apply=true" >> "$GITHUB_OUTPUT"
          echo "New append-only migration files identified; running gated db push." >> "$GITHUB_STEP_SUMMARY"
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        if: steps.migrate.outputs.apply == 'true'
        with:
          # CLI v3 (seit 2026-11-02) zielt ohne --remote auf den lokalen Stack und
          # bricht hosted-Aenderungen ohne --yes ab ("Nothing was changed"). Bis zur
          # v3-Migration auf die letzte v2 festgeschrieben, kein `latest`.
          version: 2.122.1
      - name: Link project
        if: steps.migrate.outputs.apply == 'true'
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - name: Reconcile known remote migration ledger drift
        if: steps.migrate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # These migration versions already exist in the production schema.
          # Mark them as applied in the remote ledger so db push does not replay them.
          #
          # `supabase migration repair` verlangt die zugehoerige Datei im Repo und
          # bricht sonst mit "glob ...: file does not exist" ab. Wegen `set -e` riss
          # ein einziger fehlender Eintrag den ganzen Schritt mit — und damit auch
          # das nachgelagerte `db push`, das dann uebersprungen wurde.
          #
          # Am 2026-08-16 standen hier 15 Versionen (20260813053820 bis
          # 20260814014724), die es weder als Datei im Repo noch als Zeile im
          # Prod-Ledger gab. Sie wurden entfernt: ohne Datei gibt es nichts zu
          # replayen, und ein "repair" haette nur Phantom-Zeilen ins Ledger
          # geschrieben — genau die Divergenz, die diese Liste verhindern soll.
          versions=(
            20260628121531
            20260628121551
            20260628121603
            20260628193744
            20260628193759
            20260628193820
            20260701121059
            20260715105402
            20260720123325
            20260720123711
            20260720124405
            20260802192603
          )
          for version in "${versions[@]}"; do
            # Schutz gegen Wiederholung: fehlt die Datei, ist der Eintrag wirkungslos.
            # Ueberspringen statt den Deploy zu stoppen.
            if ! compgen -G "supabase/migrations/${version}_*.sql" > /dev/null; then
              echo "::warning::$version uebersprungen — keine Migrationsdatei im Repo"
              continue
            fi
            echo "Reconciling migration history: $version => applied"
            supabase migration repair "$version" --status applied
          done
      - name: Push migrations
        if: steps.migrate.outputs.apply == 'true'
        run: |
          set +e
          supabase db push --include-all 2>&1 | tee /tmp/db-push.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::supabase db push exited with code $code — Migration nicht sauber durchgelaufen."
            echo "## db push fehlgeschlagen (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 /tmp/db-push.log >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          else
            echo "db push erfolgreich" >> "$GITHUB_STEP_SUMMARY"
          fi

  functions-deploy:
    name: Deploy edge functions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # R1 (Phase 0, 18.11.2026): Prod-Wirkung nur nach Freigabe in der GitHub-Environment `production`.
    environment: production
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # CLI v3 (seit 2026-11-02) zielt ohne --remote auf den lokalen Stack und
          # bricht hosted-Aenderungen ohne --yes ab ("Nothing was changed"). Bis zur
          # v3-Migration auf die letzte v2 festgeschrieben, kein `latest`.
          version: 2.122.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Deploy changed edge functions
        env:
          REQUESTED_FUNCTIONS: ${{ inputs.function_names }}
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          failed=""
          functions=()

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Dispatch is explicit, bounded and never infers a full redeploy.
            if [ "$DEPLOY_FUNCTIONS" != "true" ]; then
              echo "Kein Function-Deploy angefordert." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ -z "$REQUESTED_FUNCTIONS" ]; then
              echo "::error::Manueller Deploy benötigt explizite function_names; kein Deploy-all."
              exit 1
            fi
            IFS="," read -ra requested <<< "$REQUESTED_FUNCTIONS"
            declare -A seen=()
            for raw in "${requested[@]}"; do
              name="${raw//[[:space:]]/}"
              if [[ ! "$name" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
                echo "::error::Ungültiger Function-Slug: $name"
                exit 1
              fi
              if [ ! -f "supabase/functions/$name/index.ts" ]; then
                echo "::error::Function $name ist nicht als vorhandener Repo-Entrypoint bestätigt."
                exit 1
              fi
              if [ -z "${seen[$name]+x}" ]; then
                functions+=("$name")
                seen[$name]=1
              fi
            done
            if [ "${#functions[@]}" -gt 12 ]; then
              echo "::error::Mehr als 12 Functions: separaten Batch- und Rollback-Plan prüfen."
              exit 1
            fi
          else
            # Changed _shared files must never imply redeploy-all. Static
            # importer closure; uncertain or >12 targets fail closed.
            plan="/tmp/rsd-edge-deploy-plan"
            if [ -z "$PUSH_BEFORE" ] || ! git cat-file -e "$PUSH_BEFORE^{commit}"; then
              echo "::error::GitHub push baseline unavailable; no functions will be deployed."
              exit 1
            fi
            if ! node scripts/ops/plan-edge-deploy.mjs "$PUSH_BEFORE" HEAD > "$plan"; then
              echo "::error::Edge-Deploy-Scope nicht sicher bestimmbar; kein Function-Deploy."
              exit 1
            fi
            mapfile -t functions < "$plan"
          fi

          if [ "${#functions[@]}" -eq 0 ]; then
            echo "Keine geänderte Edge Function — Deploy übersprungen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Deploy scope: ${#functions[@]} Function(s)"

          # A repo directory is not a production slot. Never attempt an
          # automatic creation at the live project capacity boundary.
          # No deploy is attempted when the inventory cannot be retrieved.
          targets_file="$(mktemp)"
          live_inventory="$(mktemp)"
          printf '%s\n' "${functions[@]}" > "$targets_file"
          if ! supabase functions list --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --output json > "$live_inventory"; then
            echo "::error::Live Edge Function Inventar nicht lesbar; Deploy gestoppt."
            exit 1
          fi
          if ! node scripts/ops/check-live-edge-scope.mjs "$targets_file" "$live_inventory"; then
            echo "::error::Function fehlt live oder ist nicht ACTIVE; kein Deployment neuer Slots ohne Einzel-Freigabe."
            exit 1
          fi

          for name in "${functions[@]}"; do
            if supabase functions deploy "$name" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"; then
              ok=$((ok + 1))
            else
              failed="$failed $name"
              echo "::error::Edge Function '$name' konnte nicht deployt werden."
            fi
          done

          {
            echo "## Edge Functions"
            echo "- scope: ${#functions[@]}"
            echo "- deployt: $ok"
            if [ -n "$failed" ]; then
              echo "- fehlgeschlagen:$failed"
            else
              echo "- fehlgeschlagen: keine"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$failed" ]; then
            echo "Fehlgeschlagen:$failed"
            exit 1
          fi

          echo "Alle ${#functions[@]} Edge Functions erfolgreich deployt."