name: Migration Drift Guard

# Faengt Migrations-Drift ab: Remote-Versionen (schema_migrations) ohne Repo-Datei.
# Genau der Zustand, der `supabase db push` blockiert ("remote migration versions
# not found in local migrations directory"). Separat von deploy.yml, damit Drift
# sichtbar wird, BEVOR ein Merge den Deploy blockiert.
# Kontext: docs/runtime/SYSTEMCHECK-2026-05-28.md

on:
  schedule:
    - cron: '0 6 * * *'   # taeglich 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check-migration-drift.mjs'
      - '.github/workflows/migration-drift.yml'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        # `version: latest` loest bei jedem Lauf die neueste Release ueber die
        # GitHub-API auf. Faellt das aus ("rate limit exceeded", 2026-09-06,
        # Lauf 34033487851), stirbt der Job VOR dem Pruefskript — und damit an
        # einer Stelle, an der beide Zusagen dieses Guards nicht mehr greifen:
        # das Skript behandelt eine fehlende CLI bereits als Infra-Problem und
        # endet mit 0, und PR-Laeufe sind laut MIGRATION_DRIFT_MODE unten
        # advisory. Ein Installationsfehler ist kein Drift und darf einen PR
        # deshalb nicht blockieren.
        #
        # Bewusst NUR auf pull_request. Im taeglichen schedule-Lauf bleibt der
        # Schritt hart: dort waere ein stiller Durchlauf ohne CLI genau der
        # Befund, den dieser Guard verhindern soll — ein gruener Lauf, der
        # nichts gemessen hat.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          version: latest
      - name: Link project (best-effort; ohne Secrets uebersprungen)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.SUPABASE_PROJECT_ID }}" ]; then
            supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" || true
          else
            echo "Keine Supabase-Secrets — Link uebersprungen."
          fi
      - name: Check migration drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Drift beschreibt den Zustand der PROD-DB, nicht die Qualitaet des
          # Diffs — ein PR-Autor kann ihn nicht beheben (dafuer braucht es
          # `migration repair`/`db push` gegen Prod). Auf PRs daher advisory,
          # im taeglichen schedule-Lauf hart. So blockiert bestehender Drift
          # keine fremden PRs, bleibt aber jeden Tag sichtbar.
          MIGRATION_DRIFT_MODE: ${{ github.event_name == 'pull_request' && 'advisory' || 'fail' }}
        run: node scripts/check-migration-drift.mjs
