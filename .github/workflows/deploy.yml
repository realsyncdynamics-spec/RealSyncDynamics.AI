name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy edge functions?'
        type: boolean
        default: false

jobs:
  db-push:
    name: Push migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - name: Reconcile known remote migration ledger drift
        shell: bash
        run: |
          set -euo pipefail
          # These migration versions already exist in the production schema.
          # Mark them as applied in the remote ledger so db push does not replay them.
          #
          # `supabase migration repair` verlangt die zugehoerige Datei im Repo und
          # bricht sonst mit "glob ...: file does not exist" ab. Wegen `set -e` riss
          # ein einziger fehlender Eintrag den ganzen Schritt mit — und damit auch
          # das nachgelagerte `db push`, das dann uebersprungen wurde.
          #
          # Am 2026-08-16 standen hier 15 Versionen (20260813053820 bis
          # 20260814014724), die es weder als Datei im Repo noch als Zeile im
          # Prod-Ledger gab. Sie wurden entfernt: ohne Datei gibt es nichts zu
          # replayen, und ein "repair" haette nur Phantom-Zeilen ins Ledger
          # geschrieben — genau die Divergenz, die diese Liste verhindern soll.
          versions=(
            20260628121531
            20260628121551
            20260628121603
            20260628193744
            20260628193759
            20260628193820
            20260701121059
            20260715105402
            20260720123325
            20260720123711
            20260720124405
            20260802192603
          )
          for version in "${versions[@]}"; do
            # Schutz gegen Wiederholung: fehlt die Datei, ist der Eintrag wirkungslos.
            # Ueberspringen statt den Deploy zu stoppen.
            if ! compgen -G "supabase/migrations/${version}_*.sql" > /dev/null; then
              echo "::warning::$version uebersprungen — keine Migrationsdatei im Repo"
              continue
            fi
            echo "Reconciling migration history: $version => applied"
            supabase migration repair "$version" --status applied
          done
      - name: Push migrations
        run: |
          set +e
          supabase db push --include-all 2>&1 | tee /tmp/db-push.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::supabase db push exited with code $code — Migration nicht sauber durchgelaufen."
            echo "## db push fehlgeschlagen (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 /tmp/db-push.log >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          else
            echo "db push erfolgreich" >> "$GITHUB_STEP_SUMMARY"
          fi

  functions-deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - name: Deploy changed edge functions
        shell: bash
        run: |
          set -uo pipefail

          ok=0
          failed=""
          deploy_all=false
          functions=()

          mapfile -t changed_files < <(git diff --name-only HEAD^ HEAD)

          for file in "${changed_files[@]}"; do
            case "$file" in
              supabase/config.toml|supabase/functions/_shared/*)
                deploy_all=true
                break
                ;;
            esac
          done

          if [ "$deploy_all" = true ]; then
            while IFS= read -r dir; do
              name="$(basename "$dir")"
              case "$name" in _*) continue ;; esac
              [ -f "$dir/index.ts" ] || continue
              functions+=("$name")
            done < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d | sort)
          else
            declare -A seen=()
            for file in "${changed_files[@]}"; do
              case "$file" in
                supabase/functions/*/*)
                  rest="${file#supabase/functions/}"
                  name="${rest%%/*}"
                  case "$name" in _*) continue ;; esac
                  if [ -f "supabase/functions/$name/index.ts" ] && [ -z "${seen[$name]+x}" ]; then
                    functions+=("$name")
                    seen[$name]=1
                  fi
                  ;;
              esac
            done
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_functions }}" = "true" ] && [ "${#functions[@]}" -eq 0 ]; then
            deploy_all=true
            while IFS= read -r dir; do
              name="$(basename "$dir")"
              case "$name" in _*) continue ;; esac
              [ -f "$dir/index.ts" ] || continue
              functions+=("$name")
            done < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d | sort)
          fi

          # Ausser Betrieb genommene Functions herausfiltern. Ohne diesen Schritt
          # legt ein deploy_all-Lauf (config.toml- oder _shared-Aenderung) die im
          # Slot-Swap entfernten Functions wieder an — die freigegebenen Slots des
          # Free-Plans waeren sofort wieder belegt.
          retired_file="scripts/edge-functions-retired.txt"
          if [ -f "$retired_file" ]; then
            declare -A retired=()
            while IFS= read -r line; do
              line="${line%%#*}"
              line="$(echo "$line" | tr -d '[:space:]')"
              [ -n "$line" ] && retired[$line]=1
            done < "$retired_file"

            kept=()
            skipped=""
            # Leeres Array unter `set -u` abgesichert: hier ist noch nicht
            # geprueft, ob ueberhaupt eine Function ansteht.
            for name in "${functions[@]+"${functions[@]}"}"; do
              if [ -n "${retired[$name]+x}" ]; then
                skipped="$skipped $name"
              else
                kept+=("$name")
              fi
            done
            functions=("${kept[@]+"${kept[@]}"}")
            if [ -n "$skipped" ]; then
              echo "Uebersprungen (ausser Betrieb, $retired_file):$skipped"
              echo "Übersprungen (außer Betrieb):$skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "${#functions[@]}" -eq 0 ]; then
            echo "Keine geänderte Edge Function — Deploy übersprungen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Deploy scope: ${#functions[@]} Function(s)"

          for name in "${functions[@]}"; do
            if supabase functions deploy "$name" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"; then
              ok=$((ok + 1))
            else
              failed="$failed $name"
              echo "::error::Edge Function '$name' konnte nicht deployt werden."
            fi
          done

          {
            echo "## Edge Functions"
            echo "- scope: ${#functions[@]}"
            echo "- deployt: $ok"
            if [ -n "$failed" ]; then
              echo "- fehlgeschlagen:$failed"
            else
              echo "- fehlgeschlagen: keine"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$failed" ]; then
            echo "Fehlgeschlagen:$failed"
            exit 1
          fi

          echo "Alle ${#functions[@]} Edge Functions erfolgreich deployt."