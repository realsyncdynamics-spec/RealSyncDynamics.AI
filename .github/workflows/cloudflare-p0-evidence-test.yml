name: Cloudflare P0 evidence - offline unit tests

on:
  pull_request:
    paths:
      - 'scripts/cloudflare-p0-evidence.mjs'
      - 'scripts/cloudflare-p0-evidence.test.mjs'
      - 'docs/runbooks/cloudflare-p0-audit.md'
      - '.github/workflows/cloudflare-p0-evidence-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-audit-tests:
    name: Cloudflare evidence validation (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Syntax check (no Cloudflare credentials)
        run: node --check scripts/cloudflare-p0-evidence.mjs
      - name: Run offline unit tests (no external requests)
        run: node --test scripts/cloudflare-p0-evidence.test.mjs
