# Cloudflare Worker — isolated security baseline.
#
# Live inventory (2026-10-10):
# - existing script: realsyncdynamics (currently Hello World only)
# - production zone: realsyncdynamicsai.de
# - zone id: 47a3eccb84b03b4f62c9d713f5715736
# - NO Worker route, custom domain or api.* DNS record
# - NO R2 bucket
#
# SECURITY GATE: this file intentionally declares NO route/custom_domain.
# Do not add api.realsyncdynamicsai.de until the tenant-scoped handlers have
# verified user -> membership -> tenant authorization and security tests pass.
#
# Secrets are never committed. The current JWT verifier requires:
#   SUPABASE_JWT_SECRET
# and the public variable:
#   SUPABASE_URL
# Neither is provisioned by this PR and this PR does not deploy the Worker.

name = "realsyncdynamics"
main = "src/workers/index.ts"
compatibility_date = "2026-07-20"
compatibility_flags = ["nodejs_compat"]

[env.production]
# Reference only: zone 47a3eccb84b03b4f62c9d713f5715736
# No route is configured on purpose.

[[env.production.kv_namespaces]]
binding = "POLICY_CACHE"
id = "5bb700e74b83404caee6223533db1e90"

[observability]
enabled = true
