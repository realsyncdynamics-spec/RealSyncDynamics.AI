name: RealSync Release E2E

# Test- und Freigabe-Gate. Deployt nichts.
#   pull_request       → @smoke|@security gegen den Build dieses PRs (lokale Vorschau)
#   workflow_dispatch  → volle Suite (ohne @phone-bot) und/oder @phone-bot gegen die gewählte Umgebung
#   schedule           → @smoke gegen Production
# Release- und Nachtlauf sind fail-closed: fehlende Secrets sind ein Fehler, kein Skip.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Zu testende Umgebung'
        type: choice
        default: production
        options:
          - production
          - preview

      run_full_suite:
        description: 'Vollständige Release-Suite ausführen'
        type: boolean
        default: true

      run_phone_bot_tests:
        description: 'Telefon-Bot-Webhook-Tests ausführen'
        type: boolean
        default: true

  schedule:
    # Täglich 05:30 UTC = 06:30 MEZ (Winter) bzw. 07:30 MESZ (Sommer)
    - cron: '30 5 * * *'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'functions/**'
      - 'services/**'
      - 'workers/**'
      - 'supabase/**'
      - 'playwright.config.ts'
      - '.github/workflows/realsync-release-e2e.yml'

concurrency:
  group: realsync-release-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  realsync-release-e2e:
    name: RealSync Release E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: 'true'
      PLAYWRIGHT_HTML_OPEN: never
      VITE_GA4_MEASUREMENT_ID: G-E2ETEST0000
      VITE_META_PIXEL_ID: '000000000000000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve target environment
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_FULL: ${{ inputs.run_full_suite }}
          INPUT_PHONE: ${{ inputs.run_phone_bot_tests }}
          PRODUCTION_URL: ${{ vars.E2E_BASE_URL || 'https://realsyncdynamicsai.de' }}
          PREVIEW_URL: ${{ vars.E2E_PREVIEW_URL }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              # Der PR-Build wird lokal ausgeliefert; Playwright startet `vite preview` selbst.
              target='http://127.0.0.1:4173'
              require_config='false'
              ;;
            schedule)
              target="$PRODUCTION_URL"
              require_config='true'
              ;;
            workflow_dispatch)
              if [ "$INPUT_FULL" != 'true' ] && [ "$INPUT_PHONE" != 'true' ]; then
                echo "::error::Keine Testauswahl: run_full_suite und run_phone_bot_tests sind beide aus."
                exit 1
              fi
              if [ "$INPUT_ENVIRONMENT" = 'preview' ]; then
                if [ -z "$PREVIEW_URL" ]; then
                  echo "::error::Repository-Variable E2E_PREVIEW_URL fehlt für environment=preview."
                  exit 1
                fi
                target="$PREVIEW_URL"
              else
                target="$PRODUCTION_URL"
              fi
              require_config='true'
              ;;
            *)
              echo "::error::Nicht unterstütztes Ereignis: $EVENT_NAME"
              exit 1
              ;;
          esac
          {
            echo "E2E_BASE_URL=$target"
            echo "TEST_BASE_URL=$target"
            echo "E2E_REQUIRE_CONFIG=$require_config"
          } >> "$GITHUB_ENV"
          echo "Ziel: $target (Konfiguration erzwungen: $require_config)"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browsers
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium

      # Secrets stehen nur in den Testschritten, nicht in npm ci oder Build.

      - name: Run production smoke tests
        if: ${{ github.event_name == 'schedule' }}
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results/smoke.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/smoke
        run: |
          npx playwright test e2e/realsync-release.spec.ts \
            --config=playwright.config.ts --project=chromium \
            --grep "@smoke" \
            --output=test-results/smoke \
            --reporter=line,json,html

      - name: Run full RealSync release suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_suite }}
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_PHONE_WEBHOOK_URL: ${{ secrets.E2E_PHONE_WEBHOOK_URL }}
          E2E_PHONE_WEBHOOK_SECRET: ${{ secrets.E2E_PHONE_WEBHOOK_SECRET }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results/full.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/full
        run: |
          npx playwright test e2e/realsync-release.spec.ts \
            --config=playwright.config.ts --project=chromium \
            --grep-invert "@phone-bot" \
            --output=test-results/full \
            --reporter=line,json,html

      - name: Run PR release checks
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Fork-PRs erhalten keine Secrets; die Tests überspringen dann mit Begründung.
          E2E_PHONE_WEBHOOK_URL: ${{ secrets.E2E_PHONE_WEBHOOK_URL }}
          E2E_PHONE_WEBHOOK_SECRET: ${{ secrets.E2E_PHONE_WEBHOOK_SECRET }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results/pr.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/pr
        run: |
          npx playwright test e2e/realsync-release.spec.ts \
            --config=playwright.config.ts --project=chromium \
            --grep "@smoke|@security" \
            --output=test-results/pr \
            --reporter=line,json,html

      - name: Run phone bot webhook tests
        # Läuft auch, wenn die volle Suite rot war — der Release-Bericht soll vollständig sein.
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.run_phone_bot_tests }}
        env:
          E2E_PHONE_WEBHOOK_URL: ${{ secrets.E2E_PHONE_WEBHOOK_URL }}
          E2E_PHONE_WEBHOOK_SECRET: ${{ secrets.E2E_PHONE_WEBHOOK_SECRET }}
          E2E_PHONE_NUMBER: ${{ secrets.E2E_PHONE_NUMBER }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results/phone-bot.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/phone-bot
        # Keine Wiederholung: jeder Versuch reserviert einen simulierten Anruf.
        run: |
          npx playwright test e2e/realsync-release.spec.ts \
            --config=playwright.config.ts --project=chromium \
            --grep "@phone-bot" \
            --retries=0 --workers=1 \
            --output=test-results/phone-bot \
            --reporter=line,json,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realsync-release-e2e-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JSON test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realsync-release-e2e-json-${{ github.run_id }}
          path: e2e-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Release gate summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## RealSync Release E2E"
            echo ""
            echo "| Feld | Wert |"
            echo "|---|---|"
            echo "| Ereignis | \`${{ github.event_name }}\` |"
            echo "| Ziel | \`${E2E_BASE_URL:-unbekannt}\` |"
            echo "| Status | \`$JOB_STATUS\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$JOB_STATUS" != "success" ]; then
            echo "::error::RealSync Release E2E fehlgeschlagen. Kein Merge oder Deployment freigeben."
            echo "| Gate | **gesperrt** — kein Merge oder Deployment freigeben |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "| Gate | frei |" >> "$GITHUB_STEP_SUMMARY"
          echo "RealSync Release E2E erfolgreich."
