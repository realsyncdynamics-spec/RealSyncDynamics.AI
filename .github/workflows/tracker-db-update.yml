name: Tracker-DB Version Update

# Wöchentlicher Job: erzeugt eine frische Version-Tag für die Tracker-DB,
# basierend auf EasyList-Last-Modified-Header. Schreibt
# public/tracker-db-version.json und legt dafür einen Branch mit PR an.
#
# Nach dem Merge triggert das den Frontend-Deploy (deploy-cloudflare-pages.yml watcht
# public/**), sodass /audit-Reports automatisch neue Versions-Pills zeigen.

on:
  schedule:
    # Jeden Donnerstag um 06:00 UTC (08:00 MEZ / 09:00 MESZ)
    - cron: '0 6 * * 4'
  workflow_dispatch:

concurrency:
  group: tracker-db-version-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-tracker-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute new tracker-db version
        id: compute
        run: |
          # EasyList Last-Modified-Header als Versions-Anker
          easylist_modified=$(curl -sI https://easylist.to/easylist/easylist.txt | grep -i '^last-modified:' | cut -d' ' -f2- | tr -d '\r' || true)
          today=$(date -u +%Y-%m-%d)
          year=$(date -u +%Y)
          month=$(date -u +%m)
          # Existing micro-version aus aktueller JSON, sonst 0
          old_version=$(jq -r '.version' public/tracker-db-version.json 2>/dev/null || echo "0.0.0")
          old_micro=$(echo "$old_version" | awk -F. '{print $NF}')
          # Wenn Major (Jahr+Monat) noch identisch: micro inkrementieren
          old_major=$(echo "$old_version" | awk -F. '{print $1"."$2}')
          new_major="${year}.${month}"
          if [ "$old_major" = "$new_major" ]; then
            new_micro=$((old_micro + 1))
          else
            new_micro=0
          fi
          new_version="${new_major}.${new_micro}"
          next_update=$(date -u -d '+7 days' +%Y-%m-%d 2>/dev/null || date -u -v+7d +%Y-%m-%d)
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "next_update=$next_update" >> "$GITHUB_OUTPUT"
          echo "easylist_modified=$easylist_modified" >> "$GITHUB_OUTPUT"

      - name: Update public/tracker-db-version.json
        run: |
          cat > public/tracker-db-version.json <<EOF
          {
            "version": "${{ steps.compute.outputs.new_version }}",
            "updated_at": "${{ steps.compute.outputs.today }}",
            "easylist_last_modified": "${{ steps.compute.outputs.easylist_modified }}",
            "sources": [
              "EasyList",
              "Disconnect.me",
              "DACH-Custom"
            ],
            "next_update": "${{ steps.compute.outputs.next_update }}"
          }
          EOF
          # Format mit jq für stable diff
          jq . public/tracker-db-version.json > /tmp/tdb.json && mv /tmp/tdb.json public/tracker-db-version.json

      - name: Branch und Pull Request statt Push auf main
        # Seit dem Ruleset „main merge hygiene“ lehnt GitHub den direkten Push
        # auf main ab (GH013, belegt in den Läufen ab 22.10.2026). Der Job legt
        # deshalb einen Branch an und öffnet einen PR. Merge bleibt beim Menschen.
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.compute.outputs.new_version }}
        run: |
          git config user.name "tracker-db-bot"
          git config user.email "tracker-db-bot@users.noreply.github.com"
          if git diff --quiet public/tracker-db-version.json; then
            echo "No changes to commit"
            exit 0
          fi
          branch="chore/tracker-db-${NEW_VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::notice::Branch $branch existiert bereits – nichts zu tun."
            exit 0
          fi
          git switch -c "$branch"
          git add public/tracker-db-version.json
          git commit -m "chore(tracker-db): bump to ${NEW_VERSION}"
          git push origin "HEAD:refs/heads/$branch"
          if ! gh pr create --base main --head "$branch" \
              --title "chore(tracker-db): bump to ${NEW_VERSION}" \
              --body "Automatisch erzeugt von \`tracker-db-update.yml\`. Ändert nur \`public/tracker-db-version.json\`. Merge löst den Frontend-Deploy aus."; then
            echo "::warning::PR konnte nicht angelegt werden (Repo-Einstellung Allow GitHub Actions to create pull requests?). Branch $branch liegt bereit."
          fi
