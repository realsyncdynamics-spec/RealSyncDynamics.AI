<main>
  <h1>Kontakt</h1>
  <p>Rufen Sie uns an unter <a href="tel:+493411234567">0341 1234567</a> oder schreiben Sie uns eine E-Mail an <a href="mailto:info@mueller-haustechnik.example">info@mueller-haustechnik.example</a>.</p>
  <h2>Öffnungszeiten</h2>
  <p>Montag bis Freitag 7:00 – 17:00 Uhr</p>
  <h2>Anfahrt</h2>
  <iframe src="https://www.google.com/maps/embed?pb=!1m18" width="600" height="300"></iframe>

    <p><label for="k-name">Ihr Name *</label><input id="k-name" type="text" name="your-name" required></p>
    <p><label for="k-mail">E-Mail *</label><input id="k-mail" type="email" name="your-email" required></p>
    <p><label for="k-msg">Ihre Nachricht</label><textarea id="k-msg" name="your-message"></textarea></p>
    <p><label><input type="checkbox" name="acceptance" required> Ich stimme der <a href="/datenschutz/">Datenschutzerklärung</a> zu.</label></p>
    <p><input type="submit" value="Nachricht senden"></p>
  </form>
</main>
