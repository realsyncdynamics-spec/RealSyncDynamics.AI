# Deploy: GOVARD Gateway
#
# Deployt workers/govard-gateway — die Governance-/Evidence-Schicht vor
# austauschbaren Agenten (Policy Engine, Command State Machine, Approval
# API, Evidence Sequencer DO). Architektur: workers/govard-gateway/README.md.
#
# Der Workflow überspringt sich selbst, solange die D1-database_id in
# wrangler.jsonc noch der Platzhalter ist — gleiches Guard-Muster wie
# deploy-siteos-preview.yml. Provisionierung: README, Abschnitt
# „Provisionierung".
name: Deploy GOVARD Gateway

on:
  push:
    branches: [main]
    paths:
      - 'workers/govard-gateway/**'
      - '.github/workflows/deploy-govard-gateway.yml'
  workflow_dispatch:

concurrency:
  group: deploy-govard-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Actions müssen im Repo auf volle Commit-SHAs gepinnt sein (Org-Policy).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Guard — Cloudflare-Secrets und D1-Datenbank vorhanden?
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN/ACCOUNT_ID nicht gesetzt — Deploy übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'PLACEHOLDER_SET_VIA_WRANGLER_D1_CREATE' workers/govard-gateway/wrangler.jsonc; then
            echo "D1-Datenbank noch nicht angelegt — Deploy übersprungen."
            echo "Anleitung: workers/govard-gateway/README.md, Provisionierung."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install deps
        if: steps.guard.outputs.skip == 'false'
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Typecheck Worker
        if: steps.guard.outputs.skip == 'false'
        run: npx tsc --noEmit -p workers/govard-gateway/tsconfig.json

      # Migrationen vor dem Code: ein neuer Worker darf nie gegen ein
      # altes Schema laufen. wrangler d1 migrations ist idempotent.
      - name: Apply D1 migrations
        if: steps.guard.outputs.skip == 'false'
        run: npx wrangler d1 migrations apply govard-gateway --remote --config workers/govard-gateway/wrangler.jsonc

      - name: Deploy (wrangler)
        if: steps.guard.outputs.skip == 'false'
        run: npx wrangler deploy --config workers/govard-gateway/wrangler.jsonc
