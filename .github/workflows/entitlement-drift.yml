name: Entitlement Drift Guard

# Faengt Drift zwischen shared/pricing.ts (PLAN_ENTITLEMENTS) und der
# Datenbank (products / product_entitlements) ab. Der Guard existierte seit
# AP1 als `npm run check:entitlements`, lief aber in keinem Workflow — so
# blieb bis 2026-09-20 unbemerkt, dass das Enterprise-Produkt 3 von 64 Keys
# trug und `bots.appointments` / `bots.orders` in keinem Plan existierten.
# Kontext: Migration 20260920120000_entitlement_catalog_ssot_parity.sql.

on:
  schedule:
    - cron: '45 6 * * *'   # taeglich 06:45 UTC, nach dem Function ACL Drift Guard
  workflow_dispatch:
  pull_request:
    paths:
      - 'shared/pricing.ts'
      - 'supabase/migrations/**'
      - 'scripts/check-entitlement-parity.mjs'
      - '.github/workflows/entitlement-drift.yml'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Check entitlement parity (shared/pricing.ts ↔ DB)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        # Wie beim Migration Drift Guard: Drift beschreibt den Zustand der
        # PROD-DB, nicht die Qualitaet des Diffs — ein PR, der die Migration
        # erst mitbringt, kann die DB noch nicht geaendert haben. Auf PRs
        # deshalb advisory, im taeglichen schedule-Lauf hart.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm run check:entitlements -- --matrix
