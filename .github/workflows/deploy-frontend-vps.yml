name: Deploy Frontend to Hostinger VPS

# Stillgelegt am 2026-08-03: Production-Ziel des Frontends ist Cloudflare Pages
# (CLAUDE.md §2). Der Push-Trigger wurde entfernt, weil der Hostinger-VPS ueber
# Port 22 nicht erreichbar ist und jeder Push nach main dadurch rot wurde.
# Die Secret-Namen hier sind korrekt (VPS_SSH_*) — es fehlt nur die Konnektivitaet.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy frontend
    env:
      # Secret auf Job-Ebene heben: der secrets-Kontext ist in einem
      # step-level "if" nicht verfuegbar, der env-Kontext dagegen schon.
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
      # SSH-Port. Optionales Secret VPS_SSH_PORT; ohne dieses Secret 22.
      # Laeuft sshd auf dem VPS auf einem abweichenden Port, genuegt es, das
      # Secret zu setzen — der Workflow selbst muss nicht angefasst werden.
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run linting
        run: npm run lint 2>&1 | tee /tmp/lint.log
        continue-on-error: true

      - name: Run type check
        run: npx tsc --noEmit 2>&1 | tee /tmp/typecheck.log
        continue-on-error: true

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          CI: true

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KNOWN_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Ohne Vorabtest haengt der rsync unten bei nicht erreichbarem Host rund
      # zwei Minuten und endet mit "rsync error: unexplained error (code 255)"
      # — einer Meldung, die die eigentliche Ursache nicht nennt. Dieser Test
      # scheitert in 15 Sekunden mit klarer Diagnose.
      - name: Preflight - ist der VPS per SSH erreichbar?
        run: |
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.VPS_SSH_HOST }}/${VPS_SSH_PORT}" 2>/dev/null; then
            echo "✓ VPS auf Port ${VPS_SSH_PORT} erreichbar"
          else
            echo "::error::VPS auf Port ${VPS_SSH_PORT} nicht erreichbar — Deployment abgebrochen, bevor rsync ins Timeout laeuft."
            echo ""
            echo "Der Build ist in Ordnung; die Verbindung zum Server nicht. Uebliche Ursachen:"
            echo "  1. Firewall laesst Port ${VPS_SSH_PORT} nicht fuer GitHub-Runner zu (deren IPs wechseln)."
            echo "     Pruefen: hPanel -> VPS -> Firewall, bzw. auf dem Server 'ufw status'."
            echo "  2. sshd laeuft auf einem anderen Port. Dann Secret VPS_SSH_PORT setzen."
            echo "     Pruefen: 'ss -ltnp | grep sshd' ueber die Hostinger-Konsole."
            echo "  3. sshd laeuft nicht. Pruefen: 'systemctl status ssh'."
            echo ""
            echo "Zugang zum Server geht notfalls ueber die Browser-Konsole im hPanel,"
            echo "die kein SSH benoetigt."
            exit 1
          fi

      - name: Sync source to VPS
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_SSH_PORT} -o ConnectTimeout=15" \
            --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env*' \
            --exclude='dist' \
            . ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/var/www/realsyncdynamicsai-frontend/

      - name: Deploy on VPS via Docker Compose
        id: vps_deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_SSH_PORT}" -o ConnectTimeout=15 ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }} <<'EOF'
          set -Eeuo pipefail

          REPO_PATH="/var/www/realsyncdynamicsai-frontend"
          COMPOSE_DIR="$REPO_PATH/deploy/frontend-vps-deploy-v2"
          ENV_FILE="$COMPOSE_DIR/.env"

          if [[ ! -f "$ENV_FILE" ]]; then
            echo "ERROR: $ENV_FILE nicht vorhanden. Deployment abgebrochen."
            exit 1
          fi

          cd "$COMPOSE_DIR"

          # Tag vorheriges Image für Rollback
          if docker image inspect realsync-frontend:latest >/dev/null 2>&1; then
            docker image tag realsync-frontend:latest realsync-frontend:previous || true
            echo "✓ Rollback-Tag gesetzt: realsync-frontend:previous"
          fi

          # Build und starten
          docker compose --env-file "$ENV_FILE" up -d --build
          docker image prune -f >/dev/null 2>&1 || true

          # Auf healthy warten (max. 60s)
          echo -n "⏳ Warte auf healthy "
          for i in {1..30}; do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' realsync-frontend 2>/dev/null || echo missing)"
            if [[ "$STATUS" == "healthy" ]]; then
              echo " ✓"
              break
            fi
            echo -n "."
            sleep 2
          done

          if [[ "${STATUS:-}" != "healthy" ]]; then
            echo " FEHLER"
            docker compose logs --tail=50 frontend
            exit 4
          fi

          # Smoke-Test
          if curl -fsS "http://127.0.0.1:8090/healthz" >/dev/null 2>&1; then
            echo "✓ /healthz reachable"
          else
            echo "⚠ Warnung: /healthz auf 127.0.0.1:8090 nicht erreichbar"
          fi

          echo "✓ Frontend deployment erfolgreich"
          EOF

      # Frueher wurde hier die OEFFENTLICHE URL gecurlt:
      #     curl -fsSL https://realsyncdynamicsai.de/healthz
      # Das war ein False Positive. realsyncdynamicsai.de wird von Cloudflare
      # ausgeliefert, nicht vom VPS — gemessen am 2026-08-02: der Response traegt
      # `server: cloudflare` und liefert unter /healthz text/html (die SPA-Shell
      # aus dem Catch-all-Rewrite), waehrend die nginx.conf dieses Deployments
      # fuer genau diese Location text/plain garantiert. Der Aufruf lieferte also
      # 200 voellig unabhaengig davon, ob das VPS-Deployment etwas bewirkt hat.
      # Zusaetzlich hat der Schritt bei Misserfolg nur ein echo abgesetzt und den
      # Job nie fehlschlagen lassen — der Workflow konnte "erfolgreich deployed"
      # melden, ohne irgendetwas veraendert zu haben.
      #
      # Jetzt wird der VPS-Origin direkt adressiert (--resolve umgeht Cloudflare)
      # und der Content-Type geprueft, der VPS-nginx von der SPA-Shell
      # unterscheidet. Schlaegt das fehl, faellt der Job.
      - name: Verify VPS origin (not the Cloudflare edge)
        run: |
          set -Eeuo pipefail
          echo "⏳ Warte auf nginx propagation (5s)..."
          sleep 5

          HOST=realsyncdynamicsai.de
          IP="${{ secrets.VPS_SSH_HOST }}"

          if [ -z "$IP" ]; then
            echo "::error::VPS_SSH_HOST ist leer — Origin laesst sich nicht gezielt pruefen."
            exit 1
          fi

          # Direkt gegen den Origin, Cloudflare umgangen.
          CT="$(curl -fsS --max-time 20 -o /dev/null -w '%{content_type}' \
                 --resolve "${HOST}:443:${IP}" "https://${HOST}/healthz")" || {
            echo "::error::VPS-Origin ${IP} antwortet nicht auf https://${HOST}/healthz."
            exit 1
          }

          echo "Origin content-type: ${CT}"
          case "$CT" in
            text/plain*)
              echo "✓ VPS-Origin liefert /healthz als text/plain — Deployment ist live."
              ;;
            *)
              echo "::error::/healthz liefert '${CT}' statt text/plain. Der Origin serviert nicht die nginx.conf dieses Deployments (vermutlich antwortet die SPA-Shell oder ein anderer Dienst)."
              exit 1
              ;;
          esac

      # Nur zurueckrollen, wenn der Deploy-Schritt selbst gescheitert ist.
      # Ein blosses "failure()" wuerde auch bei einem Build-Fehler auf dem
      # Runner feuern — dabei wurde der VPS nie angefasst, und der Rollback
      # wuerde ein laufendes, gesundes Produktiv-Image auf einen aelteren
      # Stand zurueckdrehen.
      - name: Deploy failed - Automatic Rollback
        if: failure() && steps.vps_deploy.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_SSH_PORT}" -o ConnectTimeout=15 ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }} <<'EOF' || true
          set -Eeuo pipefail
          COMPOSE_DIR="/var/www/realsyncdynamicsai-frontend/deploy/frontend-vps-deploy-v2"
          ENV_FILE="$COMPOSE_DIR/.env"

          echo "⚠️  Deploy failed — triggering automatic rollback..."
          cd "$COMPOSE_DIR"

          if docker image inspect realsync-frontend:previous >/dev/null 2>&1; then
            docker image tag realsync-frontend:previous realsync-frontend:latest
            docker compose --env-file "$ENV_FILE" up -d
            echo "✓ Rolled back to previous version"
          else
            echo "⚠ No previous image available for rollback"
          fi
          EOF

      # Slack-Benachrichtigung ist optional und darf das Deploy-Ergebnis nie
      # verfaelschen:
      #   - Die Webhook-URL kommt per env (SLACK_WEBHOOK_URL), NICHT als "with"-
      #     Input — einen Input "webhook-url" gibt es in v1.26.0 nicht.
      #   - SLACK_WEBHOOK_TYPE muss auf INCOMING_WEBHOOK stehen; der Default
      #     waere WORKFLOW_TRIGGER und damit der falsche Modus fuer eine
      #     hooks.slack.com/services/...-URL.
      #   - Ohne gesetztes Secret wirft die Action ("Need to provide at least
      #     one botToken or webhookUrl") — deshalb der Secret-Guard, sonst
      #     faerbt ein geglueckter Deploy den Job rot.
      #   - continue-on-error: eine Slack-Stoerung ist kein Deploy-Fehler.
      - name: Slack notification - Success
        if: success() && env.SLACK_WEBHOOK != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "✅ Frontend deployed successfully",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Frontend Deployment Successful*\n*Repository:* ${{ github.repository }}\n*Branch:* main\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*URL:* <https://realsyncdynamicsai.de|realsyncdynamicsai.de>"
                  }
                }
              ]
            }

      - name: Slack notification - Failure
        if: failure() && env.SLACK_WEBHOOK != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "❌ Frontend deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Frontend Deployment Failed*\n*Repository:* ${{ github.repository }}\n*Branch:* main\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
                  }
                }
              ]
            }

      - name: Log summary
        if: always()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend URL:** https://realsyncdynamicsai.de" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** $([ ${{ job.status }} == 'success' ] && echo '✅ Success' || echo '❌ Failed')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Quality" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ -f /tmp/lint.log ]]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            head -20 /tmp/lint.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
