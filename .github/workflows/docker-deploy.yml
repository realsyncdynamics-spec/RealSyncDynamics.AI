name: Docker Deploy to VPS

# Stillgelegt am 2026-08-03: deployt den Docker-Stack auf den Hostinger-VPS, der
# ueber Port 22 nicht erreichbar ist. Zusaetzlich referenziert dieser Workflow die
# Secret-Namen VPS_HOST, VPS_USER und DEPLOY_PATH, die im Repo nicht existieren
# (gesetzt sind VPS_SSH_HOST, VPS_SSH_USER, VPS_FRONTEND_PATH) — er konnte also
# ohnehin nie durchlaufen. Beides vor dem Reaktivieren beheben.
on:
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: realsync-frontend

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check || npx tsc --noEmit

      - name: Unit tests
        run: npm test -- run

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_GOOGLE_GENAI_API_KEY: ${{ secrets.VITE_GOOGLE_GENAI_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_AUTH_GOOGLE_ENABLED: ${{ secrets.VITE_AUTH_GOOGLE_ENABLED || 'true' }}
          VITE_AUTH_AZURE_ENABLED: ${{ secrets.VITE_AUTH_AZURE_ENABLED || 'true' }}
          VITE_AUTH_GITHUB_ENABLED: ${{ secrets.VITE_AUTH_GITHUB_ENABLED || 'true' }}

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_GOOGLE_GENAI_API_KEY=${{ secrets.VITE_GOOGLE_GENAI_API_KEY }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
            VITE_AUTH_GOOGLE_ENABLED=${{ secrets.VITE_AUTH_GOOGLE_ENABLED || 'true' }}
            VITE_AUTH_AZURE_ENABLED=${{ secrets.VITE_AUTH_AZURE_ENABLED || 'true' }}
            VITE_AUTH_GITHUB_ENABLED=${{ secrets.VITE_AUTH_GITHUB_ENABLED || 'true' }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://realsyncdynamicsai.de
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Make scripts executable
        run: chmod +x scripts/{deploy,backup,restore,healthcheck}.sh

      - name: Pre-deployment backup
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && bash scripts/backup.sh"
        continue-on-error: true

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             git pull origin main || git pull origin master && \
             if [ ! -f .env ]; then \
               echo 'FEHLER: .env fehlt auf dem VPS. Einmalig anlegen: cp .env.docker.example .env und Werte eintragen.'; \
               exit 1; \
             fi && \
             docker-compose pull && \
             docker-compose up -d --remove-orphans"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_GOOGLE_GENAI_API_KEY: ${{ secrets.VITE_GOOGLE_GENAI_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          DOMAIN: ${{ secrets.DOMAIN || 'realsyncdynamicsai.de' }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && bash scripts/healthcheck.sh"

      - name: Smoke tests
        run: |
          for i in {1..30}; do
            if curl -sf https://realsyncdynamicsai.de/healthz; then
              echo "✓ Smoke test passed"
              exit 0
            fi
            echo "Waiting for application to be ready... ($i/30)"
            sleep 2
          done
          echo "✗ Application health check failed"
          exit 1

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment.id,
              state: 'success',
              description: 'Deployment successful',
              environment_url: 'https://realsyncdynamicsai.de'
            })

      - name: Notify deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment.id,
              state: 'failure',
              description: 'Deployment failed'
            })

      - name: Send Slack notification on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Deployment failed for RealSyncDynamics.AI",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Deployment Failed*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref }}\n*Commit:* ${{ github.sha }}\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                  }
                }
              ]
            }
        continue-on-error: true

      - name: Send Slack notification on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Deployment successful for RealSyncDynamics.AI",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Deployment Successful*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref }}\n*Commit:* ${{ github.sha }}\n*URL:* https://realsyncdynamicsai.de"
                  }
                }
              ]
            }
        continue-on-error: true

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
