# Container-interne nginx-Config für die Vite-SPA.
# Wird via Dockerfile.frontend nach /etc/nginx/conf.d/frontend.conf kopiert.
#
# Diese Config terminiert KEIN TLS — der Host-Reverse-Proxy (Traefik oder
# Host-nginx auf 80/443) übernimmt das und reicht HTTP an den Container
# weiter. Security-Headers stehen trotzdem hier, damit sie auch bei direktem
# Container-Zugriff (Debug, interne Tests) gesetzt sind.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── Healthcheck ─────────────────────────────────────────────────────────
    # Wird vom Docker-HEALTHCHECK und vom Host-Reverse-Proxy genutzt.
    # Statische Datei, keine Logs.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        try_files /healthz =200;
    }

    # ── Immutable assets — aggressiv cachen ────────────────────────────────
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|svg|png|jpg|webp|avif)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SPA-Fallback ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ── Security-Headers (Spiegel der Host-nginx-Config) ───────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                            always;
    add_header X-Content-Type-Options   "nosniff"                               always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"       always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # CSP aligned with public/_headers (Pages is production).
    add_header Content-Security-Policy  "default-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com https://connect.facebook.net https://www.googletagmanager.com https://www.google-analytics.com https://analytics.tiktok.com https://snap.licdn.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://ebljyceifhnlzhjfyxup.supabase.co wss://ebljyceifhnlzhjfyxup.supabase.co https://*.ingest.de.sentry.io https://*.ingest.sentry.io https://www.facebook.com https://www.google-analytics.com https://analytics.tiktok.com https://*.tiktok.com https://px.ads.linkedin.com https://api.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Kompression.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 5m;
}
