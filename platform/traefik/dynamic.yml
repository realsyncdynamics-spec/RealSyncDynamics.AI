# Traefik Dynamic Configuration.
#
# Das Routing selbst kommt aus den Container-Labels in docker-compose.yml.
# Hier liegen nur Middlewares und TLS-Zertifikate, die dort referenziert werden.

http:
  middlewares:
    # Security-Header für alle öffentlichen Routen.
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin

    # Rate-Limit als Basisschutz der API-Endpoints.
    api-ratelimit:
      rateLimit:
        average: 100
        burst: 50

    # HSTS für Prod-Stack (Preload-Liste).
    hsts:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/server.crt
        keyFile: /etc/traefik/certs/server.key
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
