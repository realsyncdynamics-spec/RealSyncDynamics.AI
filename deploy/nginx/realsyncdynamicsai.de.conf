# /etc/nginx/sites-available/realsyncdynamicsai.de.conf
#
# Drop into the VPS as part of the one-time setup, then symlink:
#   sudo ln -sf /etc/nginx/sites-available/realsyncdynamicsai.de.conf \
#               /etc/nginx/sites-enabled/realsyncdynamicsai.de.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# certbot --nginx will automatically inject the ssl_certificate / listen 443
# directives below; this template assumes they're already in place.

# ── 80: redirect everything to HTTPS ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name realsyncdynamicsai.de www.realsyncdynamicsai.de;

    # Allow Let's Encrypt HTTP-01 challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://realsyncdynamicsai.de$request_uri;
    }
}

# ── 443: SPA + security headers ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name realsyncdynamicsai.de;

    # certbot manages these:
    # ssl_certificate     /etc/letsencrypt/live/realsyncdynamicsai.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/realsyncdynamicsai.de/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/realsyncdynamicsai.de/dist;
    index index.html;

    # ── Kodee Ollama-Proxy (EU-lokal-AI für Edge-Functions) ────────────────
    # Wird vom Setup-Skript scripts/install-ollama-vps.sh angelegt mit dem
    # echten Bearer-Token. Endpoint: https://realsyncdynamicsai.de/_kodee/ollama
    include /etc/nginx/snippets/kodee-ollama.conf;

    # Vite-hashed assets are immutable; cache aggressively.
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|svg|png|jpg|webp|avif)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN"           always;
    add_header X-Content-Type-Options   "nosniff"              always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # CSP aligned with public/_headers (Pages is production). No *.supabase.co
    # in default-src; frame-src explicit; script-src without unsafe-inline.
    add_header Content-Security-Policy  "default-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com https://connect.facebook.net https://www.googletagmanager.com https://www.google-analytics.com https://analytics.tiktok.com https://snap.licdn.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://ebljyceifhnlzhjfyxup.supabase.co wss://ebljyceifhnlzhjfyxup.supabase.co https://*.ingest.de.sentry.io https://*.ingest.sentry.io https://www.facebook.com https://www.google-analytics.com https://analytics.tiktok.com https://*.tiktok.com https://px.ads.linkedin.com https://api.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hide nginx version
    server_tokens off;

    # Reasonable client limits
    client_max_body_size 5m;
}

# ── 443: www → apex redirect ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.realsyncdynamicsai.de;

    # certbot --nginx will request a cert that covers www. too if you pass it
    # both names; until then this block needs the same cert as above or its own.
    return 301 https://realsyncdynamicsai.de$request_uri;
}
