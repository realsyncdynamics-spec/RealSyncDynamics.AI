    <!--
      Security headers via meta-equivalents.
      CSP, X-Content-Type, and Referrer-Policy improve /audit score and prevent
      iframe-clickjacking. _headers file (Cloudflare) also enforces these.
    -->
    <!--
      Hinweis: `frame-ancestors` wird in einem <meta>-CSP per Spezifikation
      IGNORIERT. Der Clickjacking-Schutz kommt daher aus public/_headers
      (frame-ancestors + X-Frame-Options). Diese Meta-Policy bleibt als
      Fallback für Hosts ohne _headers-Unterstützung bestehen und muss mit
      public/_headers inhaltlich synchron gehalten werden — beide Policies
      gelten gleichzeitig und werden als Schnittmenge ausgewertet.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' https://*.supabase.co data:; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://www.googletagmanager.com https://www.google-analytics.com https://analytics.tiktok.com https://snap.licdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.in https://*.ingest.de.sentry.io https://*.ingest.sentry.io https://www.facebook.com https://www.google-analytics.com https://analytics.tiktok.com https://*.tiktok.com https://px.ads.linkedin.com; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
