name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy edge functions?'
        type: boolean
        default: false

jobs:
  db-push:
    name: Push migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - name: Reconcile known remote migration ledger drift
        shell: bash
        run: |
          set -euo pipefail
          # One-time reconciliation documented in docs/runbooks/edge-function-kontingent.md.
          # This changes only supabase_migrations.schema_migrations; it does not execute/revert SQL.
          versions=(
            20260628121531
            20260628121551
            20260628121603
            20260628193744
            20260628193759
            20260628193820
            20260701121059
            20260715105402
            20260720123325
            20260720123711
            20260720124405
            20260802192603
            20260813053820
            20260813055456
            20260813065822
            20260813073503
            20260813073526
            20260813073849
            20260813074134
            20260813074204
            20260813095138
            20260813095413
            20260813100130
            20260813193341
            20260813193412
            20260813204530
            20260814014724
          )
          for version in "${versions[@]}"; do
            echo "Repairing migration history: $version => reverted"
            supabase migration repair "$version" --status reverted
          done
      - name: Push migrations
        run: |
          set +e
          supabase db push --include-all 2>&1 | tee /tmp/db-push.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::supabase db push exited with code $code — Migration nicht sauber durchgelaufen."
            echo "## db push fehlgeschlagen (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 /tmp/db-push.log >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          else
            echo "db push erfolgreich" >> "$GITHUB_STEP_SUMMARY"
          fi

  functions-deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest
      - name: Deploy changed edge functions
        shell: bash
        run: |
          set -uo pipefail

          ok=0
          failed=""
          deploy_all=false
          functions=()

          mapfile -t changed_files < <(git diff --name-only HEAD^ HEAD)

          for file in "${changed_files[@]}"; do
            case "$file" in
              supabase/config.toml|supabase/functions/_shared/*)
                deploy_all=true
                break
                ;;
            esac
          done

          if [ "$deploy_all" = true ]; then
            while IFS= read -r dir; do
              name="$(basename "$dir")"
              case "$name" in _*) continue ;; esac
              [ -f "$dir/index.ts" ] || continue
              functions+=("$name")
            done < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d | sort)
          else
            declare -A seen=()
            for file in "${changed_files[@]}"; do
              case "$file" in
                supabase/functions/*/*)
                  rest="${file#supabase/functions/}"
                  name="${rest%%/*}"
                  case "$name" in _*) continue ;; esac
                  if [ -f "supabase/functions/$name/index.ts" ] && [ -z "${seen[$name]+x}" ]; then
                    functions+=("$name")
                    seen[$name]=1
                  fi
                  ;;
              esac
            done
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_functions }}" = "true" ] && [ "${#functions[@]}" -eq 0 ]; then
            deploy_all=true
            while IFS= read -r dir; do
              name="$(basename "$dir")"
              case "$name" in _*) continue ;; esac
              [ -f "$dir/index.ts" ] || continue
              functions+=("$name")
            done < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d | sort)
          fi

          if [ "${#functions[@]}" -eq 0 ]; then
            echo "Keine geänderte Edge Function — Deploy übersprungen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Deploy scope: ${#functions[@]} Function(s)"

          for name in "${functions[@]}"; do
            if supabase functions deploy "$name" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"; then
              ok=$((ok + 1))
            else
              failed="$failed $name"
              echo "::error::Edge Function '$name' konnte nicht deployt werden."
            fi
          done

          {
            echo "## Edge Functions"
            echo "- scope: ${#functions[@]}"
            echo "- deployt: $ok"
            if [ -n "$failed" ]; then
              echo "- fehlgeschlagen:$failed"
            else
              echo "- fehlgeschlagen: keine"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$failed" ]; then
            echo "Fehlgeschlagen:$failed"
            exit 1
          fi

          echo "Alle ${#functions[@]} Edge Functions erfolgreich deployt."