name: Voice company isolated migration guard
on:
  push:
    branches: [qa/voice-landing-combined-20261103]
permissions:
  contents: read
jobs:
  migration-guard:
    name: Read-only migration collision guard with explicit main ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Fetch required baseline (no merge or deploy)
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Migration collision check
        run: node scripts/check-migration-collisions.mjs
