name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'platform/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'wrangler.toml'
      - '_redirects'
      - '_headers'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'platform/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    outputs:
      cf_ready: ${{ steps.cfcheck.outputs.ready }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Detect Cloudflare credentials
        id: cfcheck
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACTIONS_CANONICAL: ${{ vars.CLOUDFLARE_ACTIONS_DEPLOY }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "## Deploy-Pfad: GitHub Actions (wrangler pages deploy)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CF_ACTIONS_CANONICAL" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare Actions deploy is required but credentials are missing."
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare Actions deploy skipped; native Cloudflare Git integration remains the deployment path."
            {
              echo "## ⚠️ Deploy-Pfad: Cloudflare-Git-Integration (NICHT dieser Workflow)"
              echo ""
              echo "Dieser Workflow **baut nur** (CLOUDFLARE_API_TOKEN/ACCOUNT_ID nicht gesetzt)."
              echo "Ein grüner Build hier heißt NICHT, dass deployt wurde — das Live-Deployment"
              echo "macht Cloudflares Git-Integration eigenständig. Ob der Stand wirklich live"
              echo "ist, prüft der Job **verify-live** unten."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint TypeScript
        run: npm run lint
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Vite + Prerender
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_STRIPE_PRICE_STARTER: ${{ secrets.VITE_STRIPE_PRICE_STARTER }}
          VITE_STRIPE_PRICE_GROWTH: ${{ secrets.VITE_STRIPE_PRICE_GROWTH }}
          VITE_STRIPE_PRICE_AGENCY: ${{ secrets.VITE_STRIPE_PRICE_AGENCY }}
          VITE_STRIPE_PRICE_STARTER_YEARLY: ${{ secrets.VITE_STRIPE_PRICE_STARTER_YEARLY }}
          VITE_STRIPE_PRICE_GROWTH_YEARLY: ${{ secrets.VITE_STRIPE_PRICE_GROWTH_YEARLY }}
          VITE_STRIPE_PRICE_AGENCY_YEARLY: ${{ secrets.VITE_STRIPE_PRICE_AGENCY_YEARLY }}
          PRERENDER_STRICT: '1'
        run: npm run build:full
      - name: Generate 404 fallback for dynamic routes
        run: |
          cp dist/index.html dist/404.html
          if [ ! -f dist/pricing.html ] && [ ! -f dist/audit.html ]; then
            echo "ERROR: expected prerendered routes missing"
            ls -la dist/ | head -20
            exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: needs.build.outputs.cf_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=realsyncdynamics-ai --branch=main

  # Prüft, ob der gepushte Commit die Domain wirklich erreicht hat — egal ob per
  # Actions-Deploy oder per Cloudflare-Git-Integration. Grundlage ist der
  # <meta name="rsd-build">-Stempel aus vite.config.ts. Läuft NUR für main-Pushes:
  # PR-Builds deployen nicht und würden hier immer scheitern.
  verify-live:
    name: Verify commit reached live domain
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Poll live build stamp
        run: |
          set -u
          BASE="https://realsyncdynamicsai.de"
          WANT="${{ github.sha }}"
          echo "Erwarteter Commit: $WANT"
          deadline=$((SECONDS + 1500))  # 25 min — Pages-Git-Build braucht einige Minuten
          while [ $SECONDS -lt $deadline ]; do
            live=$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "$BASE/?nocache=$SECONDS" \
              | grep -oE '<meta name="rsd-build" content="[0-9a-f]{7,40}"' \
              | grep -oE '[0-9a-f]{7,40}' | tail -1 || true)
            if [ -z "$live" ]; then
              echo "Noch kein rsd-build-Marker im Live-HTML (alter Build ohne Stempel?) — warte…"
            elif [ "$live" = "$WANT" ]; then
              echo "✅ Live-Domain liefert $live — Deployment bestätigt."
              echo "verify-live: ✅ Domain liefert Commit \`$live\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            elif git merge-base --is-ancestor "$WANT" "$live" 2>/dev/null; then
              echo "✅ Live-Domain liefert $live, das diesen Commit enthält (neuerer Push hat überholt)."
              echo "verify-live: ✅ Domain liefert Nachfolger-Commit \`$live\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              echo "Live liefert $live, erwartet $WANT — warte auf Propagation…"
            fi
            sleep 30
          done
          echo "::error::Build war grün, aber die Domain liefert diesen Commit nach 25 min nicht. Cloudflare-Pages-Git-Integration (Dashboard → Deployments) und Zonen-Cache prüfen."
          {
            echo "verify-live: ❌ Domain liefert Commit \`${live:-unbekannt}\` statt \`$WANT\`."
            echo "→ Cloudflare Dashboard → Pages → realsyncdynamics-ai → Deployments prüfen."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check critical routes
        run: |
          BASE="https://realsyncdynamicsai.de"
          ROUTES="/ /pricing /audit /governance-runtime /app"
          FAILED=""
          for path in $ROUTES; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 15 "${BASE}${path}" || echo "000")
            echo "${path} → HTTP ${code}"
            if [ "$code" != "200" ]; then FAILED="$FAILED $path($code)"; fi
          done
          if [ -n "$FAILED" ]; then echo "::error::Route-Check failed:$FAILED"; exit 1; fi
          echo "✓ All routes returned 200"

  smoke-test:
    name: Smoke test live routes
    needs: [build, deploy]
    if: needs.build.outputs.cf_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CDN propagation
        run: sleep 15
      - name: Check critical routes
        run: |
          BASE="https://realsyncdynamicsai.de"
          ROUTES="/ /pricing /audit /governance-runtime /app"
          FAILED=""
          for path in $ROUTES; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 15 "${BASE}${path}" || echo "000")
            echo "${path} → HTTP ${code}"
            if [ "$code" != "200" ]; then FAILED="$FAILED $path($code)"; fi
          done
          if [ -n "$FAILED" ]; then echo "::error::Smoke-test failed:$FAILED"; exit 1; fi
          echo "✓ All routes returned 200"
