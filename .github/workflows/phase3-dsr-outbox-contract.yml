name: Phase 3 DSR Outbox Static Contract

on:
  pull_request:
    paths:
      - '.github/workflows/phase3-dsr-outbox-contract.yml'
      - 'supabase/migrations/20261120040000_dsr_evidence_outbox.sql'
      - 'supabase/functions/governance-dsr/**'
      - 'supabase/functions/governance-dsr-outbox/**'
      - 'supabase/config.toml'
      - 'test/edge/governance-dsr-outbox-contract.test.ts'
      - 'test/runtime/db/dsr-evidence-outbox.db.test.ts'
      - 'scripts/test-db/dsr-outbox-up.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    name: DSR outbox contract (no PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Static DSR evidence and authorization contract
        run: npx vitest run test/edge/governance-dsr-outbox-contract.test.ts
      - name: Check test bootstrap shell syntax
        run: bash -n scripts/test-db/dsr-outbox-up.sh
      - name: Explicit PostgreSQL test status
        run: echo 'PostgreSQL integration tests NOT RUN in this workflow; isolated test database is required.'
