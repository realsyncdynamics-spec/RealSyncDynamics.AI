name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/governance-ai-product]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Edge Function syntax
        run: npm run check:edge-syntax
      # Syntaktisch fehlerfreier Code kann trotzdem beim ersten Request
      # sterben: `gdpr-audit` rief sechs Hilfsfunktionen auf, die es nie gab,
      # deployte sauber und antwortete dann monatelang mit HTTP 500 — der
      # kostenlose Audit, der wichtigste CTA der Startseite. Aufgefallen ist
      # es erst bei einem Browser-Durchlauf gegen die Live-Seite.
      - name: Edge Function references
        run: npm run check:edge-refs
      # Die kommerzielle Wahrheit steht in shared/pricing.ts. Alles Abgeleitete
      # — der Deno-Zwilling, die Plan-Katalog-Migration, die Kontingente —
      # muss daraus folgen und darf keine zweite Wahrheit daneben bilden.
      #
      # Warum das hier steht und nicht nur als npm-Skript existiert: Am
      # 2026-08-25 hat ein PR die SSoT auf ein neues Paketmodell umgestellt,
      # die Katalog-Migration aber nicht mitgezogen — und im selben Zug den
      # Test entfernt, der genau das geprueft haette. Keine CI-Stufe hat es
      # bemerkt, weil check:pricing nirgends lief.
      - name: Pricing-Kanonizitaet (SSoT, Deno-Zwilling, Plan-Katalog)
        run: npm run check:pricing
      - name: Kontingent-Kanonizitaet (Ratsche gegen neue Divergenzen)
        run: npm run check:limits
      # Ein oeffentlich zugesicherter Preis ist ein Angebot und darf nur dort
      # stehen, wo der Kaufpfad ihn einloesen kann. Dreimal stand ein Betrag
      # oeffentlich, den `stripe-checkout` nicht einloesen konnte: Enterprise
      # 1.249 € (Sentinel statt Stripe-Price), Agency 699 € und Partner
      # 1.999 € (seit AP2 stillgelegt, PLAN_RETIRED). Zweimal war die Stelle
      # per Literal-Grep nicht auffindbar — das JSON-LD steckt im
      # HTML-Template, der Betrag im ROI-Rechner kam aus der SSoT. Deshalb
      # prueft der Guard den Betrag, nicht den Plannamen.
      - name: Angebots-Sicherheit (Ratsche gegen Preise ohne Kaufpfad)
        run: npm run check:offer-prices
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  db:
    runs-on: ubuntu-latest
    name: Migration validation
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Bootstrap Supabase-equivalent stubs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- `extensions` MUSS vor pgcrypto angelegt werden: Migrationen und
          -- RPCs rufen extensions.digest(...) auf. Wird pgcrypto zuerst nach
          -- public installiert, ist ein spaeteres "WITH SCHEMA extensions"
          -- ein stiller No-op ("already exists, skipping") — extensions.digest
          -- existiert dann nie und DB-Tests scheitern an der Umgebung statt
          -- an echten Befunden.
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS vector;
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN BYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticator NOINHERIT NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          GRANT anon TO authenticator;
          GRANT authenticated TO authenticator;
          GRANT service_role TO authenticator;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), email TEXT UNIQUE, raw_user_meta_data JSONB, created_at TIMESTAMPTZ DEFAULT now());
          -- auth.uid()/auth.role() MUESSEN die JWT-Claims lesen, nicht konstant
          -- antworten. Der vorherige Stub lieferte hart NULL::uuid. Damit waere
          -- is_tenant_member() immer false, jede RLS-Policy haette immer
          -- gesperrt, und ein Isolationstest waere gruen geworden, ohne
          -- irgendetwas zu pruefen — die gefaehrlichste Sorte Test.
          -- Gleiche Semantik wie scripts/test-db/bootstrap.sql, das es lokal
          -- bereits richtig macht.
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$
            SELECT NULLIF(current_setting('request.jwt.claims', true)::jsonb ->> 'sub', '')::uuid
          $fn$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS TEXT LANGUAGE sql STABLE AS $fn$
            SELECT COALESCE(NULLIF(current_setting('request.jwt.claims', true)::jsonb ->> 'role', ''), 'authenticated')
          $fn$;
          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.secrets (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), name TEXT UNIQUE, secret TEXT, description TEXT, created_at TIMESTAMPTZ DEFAULT now(), updated_at TIMESTAMPTZ DEFAULT now());
          CREATE OR REPLACE VIEW vault.decrypted_secrets AS SELECT id, name, secret AS decrypted_secret, description, created_at, updated_at FROM vault.secrets;
          CREATE OR REPLACE FUNCTION vault.create_secret(p_secret text, p_name text, p_description text DEFAULT '') RETURNS uuid LANGUAGE sql AS $$ INSERT INTO vault.secrets (secret, name, description) VALUES (p_secret, p_name, p_description) ON CONFLICT (name) DO UPDATE SET secret = EXCLUDED.secret RETURNING id; $$;
          CREATE SCHEMA IF NOT EXISTS cron;
          CREATE TABLE IF NOT EXISTS cron.job (jobid BIGSERIAL PRIMARY KEY, schedule TEXT, command TEXT, nodename TEXT DEFAULT 'localhost', nodeport INT DEFAULT 5432, database TEXT DEFAULT 'postgres', username TEXT DEFAULT 'postgres', active BOOLEAN DEFAULT true, jobname TEXT UNIQUE);
          CREATE OR REPLACE FUNCTION cron.schedule(p_name text, p_schedule text, p_command text) RETURNS bigint LANGUAGE sql AS $$ INSERT INTO cron.job (jobname, schedule, command) VALUES (p_name, p_schedule, p_command) ON CONFLICT (jobname) DO UPDATE SET schedule = EXCLUDED.schedule, command = EXCLUDED.command RETURNING jobid; $$;
          CREATE OR REPLACE FUNCTION cron.unschedule(p_name text) RETURNS boolean LANGUAGE sql AS $$ DELETE FROM cron.job WHERE jobname = p_name; SELECT true; $$;
          CREATE SCHEMA IF NOT EXISTS net;
          CREATE OR REPLACE FUNCTION net.http_post(url text, headers jsonb DEFAULT '{}'::jsonb, body jsonb DEFAULT '{}'::jsonb, timeout_milliseconds int DEFAULT 5000) RETURNS bigint LANGUAGE sql AS 'SELECT 1::bigint';
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (id TEXT PRIMARY KEY, name TEXT NOT NULL, public BOOLEAN DEFAULT false, created_at TIMESTAMPTZ DEFAULT now(), updated_at TIMESTAMPTZ DEFAULT now());
          CREATE TABLE IF NOT EXISTS storage.objects (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), bucket_id TEXT REFERENCES storage.buckets(id) ON DELETE CASCADE, name TEXT NOT NULL, owner UUID, created_at TIMESTAMPTZ DEFAULT now(), updated_at TIMESTAMPTZ DEFAULT now(), metadata JSONB);
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          CREATE OR REPLACE FUNCTION storage.foldername(name text) RETURNS text[] LANGUAGE sql IMMUTABLE AS $$ SELECT string_to_array(regexp_replace(name, '/[^/]*$', ''), '/') $$;
          SQL
      - name: Apply all migrations in order
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "::group::$(basename "$f")"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
      # Supabase-aequivalente Default-Privileges. In einem echten Projekt haben
      # anon/authenticated Tabellenrechte in `public` — genau deshalb ist eine
      # Tabelle ohne RLS dort offen. Ohne diese GRANTs scheitert ein RLS-Test
      # an "permission denied" statt an einer Policy und beweist nichts ueber
      # die Mandantentrennung.
      - name: Grant Supabase-equivalent table privileges
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO anon, authenticated;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO service_role;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;
          SQL

      # Bis hierher validierte CI nur, dass die Migrationen fehlerfrei
      # DURCHLAUFEN — nicht, ob das entstandene Schema die Mandanten trennt.
      # Die DB-Integrationstests sprangen mangels TEST_DB_URL still ab. Genau
      # so konnten eine gruene Suite und offene Luecken nebeneinander bestehen.
      #
      # REQUIRE_DB_TESTS=1 macht das Ueberspringen hier zum Fehler: Fehlt die
      # Datenbank, faellt der Job laut aus, statt leise nichts zu pruefen.
      #
      # BEWUSST NUR security-regressions, NICHT das ganze Verzeichnis:
      # Die uebrigen Dateien in test/runtime/db/ sind gegen den minimalen
      # Harness aus scripts/test-db/up.sh geschrieben (bootstrap.sql + vier
      # SPEC-001-Migrationen) und scheitern gegen das hier voll migrierte
      # Schema an Umgebungsannahmen. Das ganze Verzeichnis zu verdrahten
      # faerbte CI dauerhaft rot — schlimmer als der bisherige Zustand, weil
      # dann auch echte Regressionen untergehen. Diese Suiten an das volle
      # Schema anzupassen ist eigene Arbeit und bleibt offen; sie hier zu
      # verschweigen waere genau der Fehler, den dieser Schritt behebt.
      # Der db-Job installierte bisher keine Node-Abhaengigkeiten — er brauchte
      # nur psql. Ohne node_modules zieht `npx vitest` das Paket zwar nach,
      # scheitert dann aber daran, dass vitest.config.ts `vitest/config` und
      # `@vitejs/plugin-react` importiert (ERR_MODULE_NOT_FOUND).
      # Deshalb hier, und bewusst NACH den Migrationen: schlaegt eine Migration
      # fehl, faellt der Job sofort, ohne erst zu installieren.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies (fuer die DB-Tests)
        run: npm ci

      - name: Security regression tests (RLS, IDOR, Billing-Upsert)
        env:
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
          REQUIRE_DB_TESTS: '1'
        run: npx vitest run test/runtime/db/security-regressions.db.test.ts --no-file-parallelism

      # Die Zusagen des Governance OS, die in der DATENBANK stehen und nicht
      # im Code — jede von ihnen deckt einen Weg ab, eine Schranke zu
      # umgehen, der mit `service_role` offenstuende:
      #
      #   connector-registry     Die Durchsetzbarkeits-Klasse laesst sich
      #                          nicht faelschen (BEFORE-Trigger ueberschreibt).
      #   publish-gate-policy    Ein Ausfall des PDP kann nicht als
      #                          Konformitaet gespeichert werden (§7 G3).
      #
      # WARUM NAMENTLICH UND NICHT DAS VERZEICHNIS: Am 2026-09-04 gemessen
      # bestehen 16 der 23 Dateien in test/runtime/db/ gegen dieses voll
      # migrierte Schema, 7 nicht — sie sind gegen den minimalen Harness aus
      # scripts/test-db/up.sh geschrieben und wenden Migrationen teils selbst
      # an. Das ganze Verzeichnis zu verdrahten faerbte CI rot. Die uebrigen
      # 14 lauffaehigen Dateien nachzuziehen ist eigene Arbeit und bleibt
      # offen; sie hier zu verschweigen waere derselbe Fehler, den der
      # Schritt darueber behebt.
      #
      # Diese beiden Dateien standen bis hierher in KEINEM CI-Lauf. Ein
      # gruener `Migration validation`-Job belegte nur, dass die Migration
      # durchlaeuft — nicht, dass der Trigger und die Bedingung wirken.
      - name: Enforcement-Zusagen in der Datenbank (P2-1, P2-3)
        env:
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
          REQUIRE_DB_TESTS: '1'
        run: |
          npx vitest run \
            test/runtime/db/connector-registry.db.test.ts \
            test/runtime/db/publish-gate-policy.db.test.ts \
            --no-file-parallelism

      - name: Verify migrations are append-only
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[hotfix]')
        run: |
          set -e
          changed=$(git diff --name-only origin/main...HEAD -- 'supabase/migrations/' || true)
          modified_existing=""
          for f in $changed; do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              if ! git diff --quiet "origin/main" -- "$f"; then
                modified_existing="$modified_existing $f"
              fi
            fi
          done
          if [ -n "$modified_existing" ]; then
            echo "❌ append-only rule broken; do not edit merged migrations:"
            for f in $modified_existing; do echo "  $f"; done
            exit 2
          fi
          echo "✅ migrations are append-only"
