name: Claude Code Review

# Automatisches Review auf jedem offenen, nicht-draft PR.
# Kommentar, kein required check, blockiert Merge nicht.
# Quelle: anthropics/claude-code-action examples/pr-review-comprehensive.yml (v1).
# Ohne Secret skippt der Job.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: |
      (secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Prioritize real defects over style.

            Focus:
            1. Tenant isolation, auth, membership roles (owner/admin/dpo/editor/viewer_auditor — never invent a role named member).
            2. Entitlements only from the server catalog, not UI or FREE_TIER_FALLBACK.
            3. Secrets, service-role keys, cron auth, and request-body tenant IDs.
            4. Logic errors, missing tests for the changed path, and claims that the code does not implement.

            Skip nitpicks and generated lockfile noise.
            Use inline comments for concrete findings.
            Use a top-level comment for the summary. Do not approve or request changes as a required reviewer.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
