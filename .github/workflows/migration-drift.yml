name: Migration Drift Guard

# Faengt Migrations-Drift ab: Remote-Versionen (schema_migrations) ohne Repo-Datei.
# Genau der Zustand, der `supabase db push` blockiert ("remote migration versions
# not found in local migrations directory"). Separat von deploy.yml, damit Drift
# sichtbar wird, BEVOR ein Merge den Deploy blockiert.
# Kontext: docs/runtime/SYSTEMCHECK-2026-05-28.md

on:
  schedule:
    - cron: '0 6 * * *'   # taeglich 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check-migration-drift.mjs'
      - '.github/workflows/migration-drift.yml'

# Eng gefasst: Der Waechter liest den Stand und schreibt genau ein
# Alarm-Issue. Keine weiteren Rechte.
permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest
      - name: Link project (best-effort; ohne Secrets uebersprungen)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.SUPABASE_PROJECT_ID }}" ]; then
            supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" || true
          else
            echo "Keine Supabase-Secrets — Link uebersprungen."
          fi
      - name: Check migration drift
        id: guard
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Drift beschreibt den Zustand der PROD-DB, nicht die Qualitaet des
          # Diffs — ein PR-Autor kann ihn nicht beheben (dafuer braucht es
          # `migration repair`/`db push` gegen Prod). Auf PRs daher advisory,
          # im taeglichen schedule-Lauf hart. So blockiert bestehender Drift
          # keine fremden PRs, bleibt aber jeden Tag sichtbar.
          MIGRATION_DRIFT_MODE: ${{ github.event_name == 'pull_request' && 'advisory' || 'fail' }}
        run: node scripts/check-migration-drift.mjs

      # Der Waechter meldet ab hier dorthin, wo jemand hinsieht.
      #
      # Sein einziges hartes Signal steht im `schedule`-Lauf — auf PRs laeuft
      # er bewusst `advisory`, damit bestehender Drift keine fremden PRs
      # blockiert. Die Begruendung ist richtig, aber sie hatte zur Folge,
      # dass dieser Waechter vom 2026-08-26 bis zum 2026-08-29 jeden Morgen
      # rot war, ohne dass es jemandem auffiel. Vier Tage, in denen keine
      # Migration mehr Produktion erreichte.
      #
      # Nur im `schedule`-Lauf, und `always()`, damit auch der gruene Fall
      # ankommt: Er schliesst das Issue wieder.
      - name: Drift-Alarm melden
        if: always() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARD_KEY: migration
          GUARD_TITLE: Migration Drift Guard
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-drift-alarm.mjs ${{ steps.guard.outcome == 'failure' && 'alarm' || 'resolve' }}

      - name: Ergebnis des Wächters durchreichen
        if: always() && github.event_name == 'schedule' && steps.guard.outcome == 'failure'
        run: |
          echo "Der Wächter hat Drift gemeldet — siehe Schritt oben und das Drift-Alarm-Issue."
          exit 1
