name: SiteOS Production E2E

on:
  push:
    branches:
      - feature/siteos-production-e2e

concurrency:
  group: siteos-production-e2e
  cancel-in-progress: false

jobs:
  publish:
    name: Governed SiteOS preview to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BASE_URL: https://realsyncdynamicsai.de
      RUN_SITEOS_PRODUCTION_E2E: 'true'
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      CI: 'true'

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Require real test-user secrets
        shell: bash
        run: |
          test -n "$E2E_TEST_EMAIL" || { echo "E2E_TEST_EMAIL secret missing"; exit 1; }
          test -n "$E2E_TEST_PASSWORD" || { echo "E2E_TEST_PASSWORD secret missing"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run real production publish acceptance
        run: npx playwright test e2e/siteos-production-publish.spec.ts --project=chromium --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siteos-production-e2e-report
          path: playwright-report/
          retention-days: 7
