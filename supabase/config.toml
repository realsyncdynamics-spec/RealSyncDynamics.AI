# Supabase local development config.
# https://supabase.com/docs/guides/cli/config
#
# Used by `supabase start` (local stack) and `supabase db reset`. Project-link
# data lives outside the repo (~/.supabase) and is unrelated to this file.

project_id = "realsyncdynamics-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

# ──────────────────────────────────────────────────────────────────────────
# Per-function verify_jwt config.
#
# `supabase functions deploy` reads this for each function. Default is true.
# Anything listed here as false bypasses the platform JWT gateway — the
# function itself is responsible for its own auth (HMAC signature, signed
# tokens, public free-tool semantics, cron-triggered, etc.).
#
# CRITICAL: webhook receivers (stripe-webhook, shopify-webhooks,
# governance-ingest, governance-webhooks, workflow-callback,
# newsletter-confirm) MUST stay false — external callers cannot send a
# Supabase JWT. Same goes for OAuth callbacks (shopify-callback) and
# Stripe-redirect handoffs (checkout-website-rebuild).
# ──────────────────────────────────────────────────────────────────────────

# ── External webhooks (no JWT possible) ──
[functions.stripe-webhook]
verify_jwt = false

[functions.shopify-webhooks]
verify_jwt = false

[functions.shopify-callback]
verify_jwt = false

[functions.workflow-callback]
verify_jwt = false

[functions.automation-callback]
verify_jwt = false

[functions.governance-ingest]
verify_jwt = false

[functions.security-signal-ingest]
verify_jwt = false

[functions.governance-webhooks]
verify_jwt = false

[functions.newsletter-confirm]
verify_jwt = false

[functions.checkout-website-rebuild]
verify_jwt = false

# ── Public free tools / anonymous ingress ──
[functions.gdpr-audit]
verify_jwt = false

# Audit-Report-Email: fire-and-forget vom Browser nach dem Scan (kein JWT).
# Sicher: Zugriff nur per UUID, idempotent (email_sent_at-Guard).
[functions.audit-report-email]
verify_jwt = false

# Health-Probe — oeffentlich, fuer Uptime-Monitoring und Status-Page.
# Antwortet 200 / 503; keine sensiblen Daten, keine Auth noetig.
[functions.health]
verify_jwt = false

[functions.cookie-scan]
verify_jwt = false

[functions.cookie-scan-deep]
verify_jwt = false

# Browser-action-log — governance observability. Called from browser without JWT
# (EmbeddedBrowserCanvas). Auth + tenant-scope checked inside the function via
# service_role calls to Supabase (browser passes tenantId, which is validated by RLS).
[functions.browser-action-log]
verify_jwt = false

# AI Gateway — provider-neutral inference endpoint.
#
# Stand vor dem 2026-08-09: verify_jwt = false, mit dem Vermerk, die Auth
# komme "in a follow-up PR". Der PR kam nie. Ein Probe-Request ohne jeden
# Header lieferte in Produktion HTTP 200 und meldete den Anthropic-Fallback
# als `ok: true` — jeder im Internet konnte Inferenz auf Kosten des
# Betreibers ausloesen. Das In-Memory-Rate-Limit im Function-Code schuetzt
# davor nicht: es lebt pro Isolate, verfaellt bei jedem Cold Start und ist
# per IP-Rotation umgehbar.
#
# Beide Clients (src/core/ai-gateway/edgeClient.ts und der Deno-Zwilling)
# senden bereits `apikey` + `Authorization: Bearer <key>`. verify_jwt = true
# ist damit fuer die bestehenden Aufrufer transparent und schliesst den
# anonymen Zugriff von aussen.
#
# WICHTIG — das ist der erste Schritt, nicht die Loesung. Der Anon-Key steht
# per Definition im Browser-Bundle. verify_jwt = true stoppt die anonyme
# Nutzung durch Dritte ohne Key, nicht den Missbrauch durch jemanden, der
# den Key aus dem Bundle liest. Offen bleiben: Tenant-Aufloesung,
# persistentes Rate-Limit (Tabelle `_rate_limits` existiert bereits),
# ai_tool_runs-Logging und Anbindung an _shared/cost-cap.ts.
# Siehe docs/audits/CODE_REALITY_AUDIT_2026-08-09.md, Befund C-04.
[functions.ai-gateway]
verify_jwt = true

