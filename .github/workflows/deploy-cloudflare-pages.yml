name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'platform/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'wrangler.toml'
      - '_redirects'
      - '_headers'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'platform/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  # Je Referenz statt global. Zuvor lag jeder Lauf des Repositories in
  # derselben Gruppe `cloudflare-pages` — ein haengender Job blockierte
  # damit auch Deploys von `main`, nicht nur den eigenen PR.
  group: cloudflare-pages-${{ github.ref }}
  # Fuer Pull Requests loest ein neuer Push den vorigen Lauf ab: Der alte
  # prueft ohnehin einen ueberholten Stand.
  #
  # Fuer `main` bleibt es bei `false`. Einen laufenden Produktions-Deploy
  # mittendrin abzubrechen, waere gefaehrlicher als ihn zu Ende laufen zu
  # lassen — dabei koennte ein halb hochgeladener Stand ausgeliefert werden.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    # Build inklusive Prerender braucht regulaer rund fuenf Minuten. Ohne diese Grenze gilt der GitHub-Standard von 360 Minuten —
    # ein haengender Schritt blockiert dann sechs Stunden lang die
    # Warteschlange, statt schnell und lesbar zu scheitern.
    timeout-minutes: 25
    outputs:
      cf_ready: ${{ steps.cfcheck.outputs.ready }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Detect Cloudflare credentials
        id: cfcheck
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACTIONS_CANONICAL: ${{ vars.CLOUDFLARE_ACTIONS_DEPLOY }}
        # Die Zusammenfassung ist hier kein Beiwerk, sondern der Punkt.
        # Dieser Workflow heisst "Deploy to Cloudflare Pages" und meldet auf
        # `main` regelmaessig `success`, waehrend die Jobs `deploy` und
        # `smoke-test` uebersprungen werden — beide haengen an `cf_ready`.
        # Das ist so gewollt (die Git-Integration liefert aus), liest sich am
        # gruenen Haken aber wie ein erfolgter Deploy. Gemessen am 2026-09-06:
        # Auf demselben Commit steht "Deploy to Cloudflare Pages"
        # (uebersprungen, GitHub Actions) direkt neben "Cloudflare Pages"
        # (erfolgreich, App "Cloudflare Workers and Pages") — wer den ersten
        # liest, haelt den Deploy fuer ausgefallen.
        #
        # Der Workflow-Name bleibt bewusst unveraendert: Er kann als
        # `required check` in einer Branch-Protection-Regel stehen, und ein
        # umbenannter Check gilt dort als fehlend statt als bestanden. Die
        # Klarstellung geht deshalb in die Zusammenfassung, nicht in den Namen.
        run: |
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            summary "## Deploy aus GitHub Actions"
            summary ""
            summary "Cloudflare-Zugangsdaten vorhanden — dieser Lauf deployt und prueft danach die Live-Routen."
          elif [ "$CF_ACTIONS_CANONICAL" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            summary "## Deploy fehlgeschlagen: Zugangsdaten fehlen"
            summary ""
            summary "\`CLOUDFLARE_ACTIONS_DEPLOY\` ist auf \`true\` gesetzt, also ist der Actions-Pfad verbindlich —"
            summary "aber \`CLOUDFLARE_API_TOKEN\` und/oder \`CLOUDFLARE_ACCOUNT_ID\` fehlen."
            echo "::error::Cloudflare Actions deploy is required but credentials are missing."
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            summary "## Dieser Lauf hat NICHT deployt"
            summary ""
            summary "Gebaut wurde, ausgeliefert nicht. Die Jobs \`Deploy to Cloudflare Pages\` und"
            summary "\`Smoke test live routes\` sind uebersprungen, weil keine Cloudflare-Zugangsdaten"
            summary "hinterlegt sind. **Ein gruener Haken an diesem Workflow ist kein Deploy-Beleg.**"
            summary ""
            summary "Ausgeliefert wird durch die **Cloudflare-Git-Integration** (im Dashboard konfiguriert)."
            summary "Ihr Beleg ist ein eigener Check-Run auf demselben Commit:"
            summary ""
            summary "| Check-Run | App | Bedeutung |"
            summary "|---|---|---|"
            summary "| \`Cloudflare Pages\` | Cloudflare Workers and Pages | **der echte Deploy** |"
            summary "| \`Deploy to Cloudflare Pages\` | GitHub Actions | dieser Job — hier uebersprungen |"
            summary ""
            summary "Der Name traegt nicht, die App entscheidet. Hergang und Messmethode:"
            summary "\`docs/runbooks/deployment-kette-messen.md\`."
            echo "::notice::Kein Deploy aus diesem Lauf — die Cloudflare-Git-Integration liefert aus (Check-Run 'Cloudflare Pages')."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint TypeScript
        run: npm run lint
      - name: Install Playwright Chromium
        # `--with-deps` ruft im Hintergrund `apt-get` gegen die Ubuntu-Spiegel.
        # Genau dort hingen am 2026-08-19 zwei Laeufe bis zum Job-Timeout: Das
        # Log endet mitten in `apt-get update` mit `Ign:` fuer jedes Repository,
        # danach 28 Minuten Stille, und `playwright-report/` blieb leer — es lief
        # kein einziger Test. Auffaellig war, dass ausschliesslich die zwei Jobs
        # mit diesem Schritt hingen, alle uebrigen liefen gruen durch.
        #
        # Das Runner-Image `ubuntu-latest` bringt die Systembibliotheken fuer
        # Chromium bereits mit (Chrome ist vorinstalliert). Der apt-Lauf sichert
        # hier also gegen ein Risiko ab, das nicht besteht — und schafft dabei
        # ein neues.
        #
        # `timeout-minutes` bleibt als Netz: Haengt der Download doch einmal,
        # faellt der Job nach sechs Minuten mit einer lesbaren Meldung aus,
        # statt eine halbe Stunde still zu blockieren.
        timeout-minutes: 6
        run: npx playwright install chromium
      - name: Build Vite + Prerender
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_STRIPE_PRICE_STARTER: ${{ secrets.VITE_STRIPE_PRICE_STARTER }}
          VITE_STRIPE_PRICE_GROWTH: ${{ secrets.VITE_STRIPE_PRICE_GROWTH }}
          VITE_STRIPE_PRICE_AGENCY: ${{ secrets.VITE_STRIPE_PRICE_AGENCY }}
          VITE_STRIPE_PRICE_STARTER_YEARLY: ${{ secrets.VITE_STRIPE_PRICE_STARTER_YEARLY }}
          VITE_STRIPE_PRICE_GROWTH_YEARLY: ${{ secrets.VITE_STRIPE_PRICE_GROWTH_YEARLY }}
          VITE_STRIPE_PRICE_AGENCY_YEARLY: ${{ secrets.VITE_STRIPE_PRICE_AGENCY_YEARLY }}
          PRERENDER_STRICT: '1'
        run: npm run build:full
      - name: Generate 404 fallback for dynamic routes
        run: |
          cp dist/index.html dist/404.html
          if [ ! -f dist/pricing.html ] && [ ! -f dist/audit.html ]; then
            echo "ERROR: expected prerendered routes missing"
            ls -la dist/ | head -20
            exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    # Upload nach Cloudflare Pages. Ohne diese Grenze gilt der GitHub-Standard von 360 Minuten —
    # ein haengender Schritt blockiert dann sechs Stunden lang die
    # Warteschlange, statt schnell und lesbar zu scheitern.
    timeout-minutes: 15
    needs: build
    if: needs.build.outputs.cf_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=realsyncdynamics-ai --branch=main

  smoke-test:
    name: Smoke test live routes
    # Wenige HTTP-Pruefungen gegen die ausgelieferte Seite. Ohne diese Grenze gilt der GitHub-Standard von 360 Minuten —
    # ein haengender Schritt blockiert dann sechs Stunden lang die
    # Warteschlange, statt schnell und lesbar zu scheitern.
    timeout-minutes: 10
    needs: [build, deploy]
    if: needs.build.outputs.cf_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CDN propagation
        run: sleep 15
      - name: Check critical routes
        # Geprueft wird der INHALT, nicht der Statuscode.
        #
        # Die Vorgaengerfassung verglich fuenf Routen gegen HTTP 200 und
        # konnte per Konstruktion nicht fehlschlagen: `public/_redirects`
        # endet auf `/*  /index.html  200`, also antwortet JEDE URL mit 200.
        # Am 2026-09-06 gegengeprueft — `/gibt-es-garantiert-nicht-xyz123`
        # lieferte 200. Der Test waere auch dann gruen gewesen, wenn
        # saemtliche Routen gefehlt haetten.
        #
        # Die beiden Klassen sind bewusst getrennt, weil sie sich verschieden
        # verhalten muessen (am 2026-09-06 an der Live-Seite gemessen):
        #
        #   /pricing 192 kB · /audit 42 kB · /governance-runtime 37 kB
        #     prerendert, je eigener <title>
        #   / und /app  je 63 kB, IDENTISCHER <title>
        #     /app ist nicht prerendert und liefert regulaer den SPA-Fallback,
        #     ist vom Fallback einer unbekannten URL also nicht zu
        #     unterscheiden. Ein "eigener Titel"-Test wuerde /app faelschlich
        #     rot machen.
        run: |
          BASE="https://realsyncdynamicsai.de"
          PRERENDERED="/pricing /audit /governance-runtime"
          SHELL_ROUTES="/ /app"
          FAILED=""

          title_of() {
            curl -sS -L --max-time 15 "$1" 2>/dev/null | tr -d '\n' \
              | grep -oE '<title>[^<]*</title>' | head -1
          }

          HOME_TITLE=$(title_of "${BASE}/")
          if [ -z "$HOME_TITLE" ]; then
            echo "::error::Startseite liefert keinen <title> — Auslieferung defekt oder Prerender ausgefallen."
            exit 1
          fi
          echo "Startseite/Fallback: ${HOME_TITLE}"

          # Kontrolle ZUERST. Ohne sie wiederholte dieser Test den alten
          # Fehler: Wenn alle Routen denselben Inhalt lieferten, saehe der
          # Vergleich unten trotzdem plausibel aus. Diese Zeile weist nach,
          # dass der Test ueberhaupt unterscheiden KANN.
          CONTROL=$(title_of "${BASE}/__smoke-control-$(date +%s)")
          if [ "$CONTROL" != "$HOME_TITLE" ]; then
            echo "::error::Kontrolle fehlgeschlagen: eine unbekannte URL liefert nicht den SPA-Fallback (erwartet '${HOME_TITLE}', erhalten '${CONTROL}'). Die Annahme dieses Tests gilt nicht mehr — _redirects pruefen und den Test anpassen."
            exit 1
          fi
          echo "✓ Kontrolle: unbekannte URL faellt auf die Shell zurueck — der Test kann unterscheiden"

          # Prerenderte Routen muessen einen EIGENEN Titel tragen. Gleicht er
          # dem der Startseite, wurde der Fallback ausgeliefert: Die Route
          # fehlt oder das Prerendering ist ausgefallen. Genau das sah die
          # alte Fassung nicht.
          for path in $PRERENDERED; do
            t=$(title_of "${BASE}${path}")
            if [ -z "$t" ]; then
              echo "${path} → kein <title>"
              FAILED="$FAILED ${path}(kein-title)"
            elif [ "$t" = "$HOME_TITLE" ]; then
              echo "${path} → Fallback statt eigener Seite"
              FAILED="$FAILED ${path}(fallback)"
            else
              echo "${path} → ${t}"
            fi
          done

          # Shell-Routen: nicht prerendert, der Fallback ist hier korrekt.
          # Pruefbar bleibt, dass die SPA ueberhaupt ausgeliefert wird —
          # Wurzelelement und Einstiegs-Bundle.
          for path in $SHELL_ROUTES; do
            body=$(curl -sS -L --max-time 15 "${BASE}${path}" 2>/dev/null)
            miss=""
            echo "$body" | grep -q 'id="root"' || miss="${miss}(kein-root-div)"
            echo "$body" | grep -qE 'src="/assets/index-[^"]+\.js"' || miss="${miss}(kein-bundle)"
            if [ -n "$miss" ]; then
              echo "${path} → ${miss}"
              FAILED="$FAILED ${path}${miss}"
            else
              echo "${path} → SPA-Shell vollstaendig"
            fi
          done

          if [ -n "$FAILED" ]; then echo "::error::Smoke-test failed:$FAILED"; exit 1; fi
          echo "✓ Alle geprueften Routen liefern den erwarteten Inhalt"
