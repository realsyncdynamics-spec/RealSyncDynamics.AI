# AI-App-Builder + RealSyncDynamicsAI-Governance — lokaler Stack.
#
# Start: docker compose up --build

services:
  traefik:
    image: traefik:v3.2
    container_name: rsd_traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/etc/traefik/certs:ro
      - ./traefik/acme.json:/etc/traefik/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [rsd_net]

  governance_backend:
    build: ./governance_backend
    container_name: rsd_governance
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
      DATABASE_URL: postgresql://postgres:postgres@supabase_db:5432/postgres
      GOVERNANCE_AUTH_TOKENS: ${GOVERNANCE_AUTH_TOKENS:-}
      GOVERNANCE_SERVICE_TOKEN: ${GOVERNANCE_SERVICE_TOKEN:-}
      GOVERNANCE_WEBHOOK_URL: ""
    ports: ["8002:8002"]
    depends_on:
      supabase_db: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.governance.rule=Host(`rsd.localhost`)
      - traefik.http.routers.governance.entrypoints=web,websecure
      - traefik.http.routers.governance.tls=true
      - traefik.http.services.governance.loadbalancer.server.port=8002
    networks: [rsd_net]

  builder_orchestrator:
    build:
      context: ./builder_orchestrator
      dockerfile: Dockerfile.playwright
    container_name: rsd_builder
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
      GOVERNANCE_BASE_URL: http://governance_backend:8002
      BUILDER_AUTH_TOKENS: ${BUILDER_AUTH_TOKENS:-}
      GOVERNANCE_SERVICE_TOKEN: ${GOVERNANCE_SERVICE_TOKEN:-}
      DATABASE_URL: postgresql://postgres:postgres@supabase_db:5432/postgres
      BUILDER_MAX_CONCURRENCY: "4"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      LLM_MAX_REPAIRS: ${LLM_MAX_REPAIRS:-1}
      BUILDER_TOKEN_BUDGET: ${BUILDER_TOKEN_BUDGET:-200000}
      BUILDER_WORKSPACE_ROOT: /workspaces
      BUILDER_TEST_COMMAND: ${BUILDER_TEST_COMMAND:-}
    volumes: [builder_workspaces:/workspaces]
    ports: ["8001:8001"]
    depends_on:
      governance_backend: { condition: service_started }
      supabase_db: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.builder.rule=Host(`builder.localhost`)
      - traefik.http.routers.builder.entrypoints=web,websecure
      - traefik.http.routers.builder.tls=true
      - traefik.http.services.builder.loadbalancer.server.port=8001
    networks: [rsd_net]

  nextjs_frontend:
    build: ./nextjs_frontend
    container_name: rsd_frontend
    environment:
      NEXT_PUBLIC_BUILDER_URL: ${NEXT_PUBLIC_BUILDER_URL:-http://builder.localhost}
      NEXT_PUBLIC_GOVERNANCE_URL: ${NEXT_PUBLIC_GOVERNANCE_URL:-http://rsd.localhost}
    ports: ["3000:3000"]
    depends_on: [builder_orchestrator, governance_backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`app.localhost`)
      - traefik.http.routers.frontend.entrypoints=web,websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    networks: [rsd_net]

  supabase_db:
    image: postgres:16-alpine
    container_name: rsd_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes: [rsd_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rsd_net]

volumes:
  rsd_pgdata:
  builder_workspaces:

networks:
  rsd_net:
    driver: bridge
