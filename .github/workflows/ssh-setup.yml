name: SSH Host Scan

# This helper may be used to obtain the current host key for VPS_SSH_KNOWN_HOST.
# It deliberately does NOT generate or print a private key. GitHub Actions job
# summaries are visible to repository users and are not a secure private-key
# transport.

on:
  workflow_dispatch:

jobs:
  scan-host:
    runs-on: ubuntu-latest
    steps:
      - name: Scan VPS SSH host key
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          if [ -z "$VPS_SSH_HOST" ]; then
            echo "::error::VPS_SSH_HOST is not configured."
            exit 1
          fi

          echo "## SSH host-key scan"
          echo "Target: ${VPS_SSH_HOST}:${VPS_SSH_PORT}"
          echo ""
          echo "### VPS_SSH_KNOWN_HOST"
          ssh-keyscan -p "$VPS_SSH_PORT" -t ed25519 "$VPS_SSH_HOST" 2>/dev/null | tee /tmp/known-host

          if [ ! -s /tmp/known-host ]; then
            echo "::error::No ed25519 host key was returned. Check SSH connectivity and port."
            exit 1
          fi

          {
            echo ""
            echo "Copy the single line above into the VPS_SSH_KNOWN_HOST secret after verifying it against the server console."
            echo ""
            echo "No private key was generated or exposed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
