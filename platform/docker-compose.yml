# AI-App-Builder + RealSyncDynamicsAI-Governance — lokaler Stack.
#
# Start:  docker compose up --build
# Hosts:  http://builder.localhost | http://rsd.localhost | http://app.localhost
#         traefik.localhost:8080 (Dashboard)
#
# Hinweis: *.localhost löst auf den meisten Systemen automatisch auf 127.0.0.1 auf.
# Falls nicht, Einträge in /etc/hosts ergänzen.

services:
  traefik:
    image: traefik:v3.2
    container_name: rsd_traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard (nur lokal!)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/acme.json:/etc/traefik/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - rsd_net

  governance_backend:
    build: ./governance_backend
    container_name: rsd_governance
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
      # Gesetzt = Inventar und Befunde liegen in Postgres und überleben einen
      # Neustart. Leeren, um bewusst In-Memory zu fahren.
      DATABASE_URL: postgresql://postgres:postgres@supabase_db:5432/postgres
      # Auth. Leer = aus (nur lokal!) — /health meldet den Zustand.
      GOVERNANCE_AUTH_TOKENS: ${GOVERNANCE_AUTH_TOKENS:-}
      GOVERNANCE_SERVICE_TOKEN: ${GOVERNANCE_SERVICE_TOKEN:-}
      # Incident-Dispatch an n8n; leer = Befunde nur über die API sichtbar.
      GOVERNANCE_WEBHOOK_URL: ""
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8002:8002"
    depends_on:
      supabase_db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.governance.rule=Host(`rsd.localhost`)
      - traefik.http.routers.governance.entrypoints=web,websecure
      - traefik.http.routers.governance.tls=true
      - traefik.http.services.governance.loadbalancer.server.port=8002
    networks:
      - rsd_net

  builder_orchestrator:
    build: ./builder_orchestrator
    container_name: rsd_builder
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
      GOVERNANCE_BASE_URL: http://governance_backend:8002
      # Auth. Leer = aus (nur lokal!). Das Service-Token muss dem des
      # Governance-Backends entsprechen, sonst weist es die Aufrufe ab.
      BUILDER_AUTH_TOKENS: ${BUILDER_AUTH_TOKENS:-}
      GOVERNANCE_SERVICE_TOKEN: ${GOVERNANCE_SERVICE_TOKEN:-}
      # Gesetzt = laufende und abgeschlossene Builds überleben einen Neustart.
      DATABASE_URL: postgresql://postgres:postgres@supabase_db:5432/postgres
      BUILDER_MAX_CONCURRENCY: "4"
      # LLM-Provider. Ohne Key antwortet der Stub-Provider deterministisch —
      # der Stack startet also auch ohne Zugangsdaten, die Agenten liefern
      # dann leere, aber schema-konforme Ergebnisse. Für echte Läufe den Key
      # in eine .env legen (nicht ins Repo).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      # EU-lokale Alternative: LLM_PROVIDER=ollama + OLLAMA_BASE_URL setzen.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      LLM_MAX_REPAIRS: ${LLM_MAX_REPAIRS:-1}
      # Token-Obergrenze je Build. 0 = unbegrenzt.
      BUILDER_TOKEN_BUDGET: ${BUILDER_TOKEN_BUDGET:-0}
      # Generierte Dateien. Ohne Volume sind sie nach einem Neustart weg —
      # der Task-Graph in Postgres verweist dann auf ein leeres Verzeichnis.
      BUILDER_WORKSPACE_ROOT: /workspaces
      # Leer = kein Testnachweis => das Gate blockiert (fail-closed).
      BUILDER_TEST_COMMAND: ${BUILDER_TEST_COMMAND:-}
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    volumes:
      - builder_workspaces:/workspaces
    ports:
      - "8001:8001"
    depends_on:
      governance_backend:
        condition: service_started
      supabase_db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.builder.rule=Host(`builder.localhost`)
      - traefik.http.routers.builder.entrypoints=web,websecure
      - traefik.http.routers.builder.tls=true
      - traefik.http.services.builder.loadbalancer.server.port=8001
    networks:
      - rsd_net

  nextjs_frontend:
    build: ./nextjs_frontend
    container_name: rsd_frontend
    environment:
      # Browser-seitige Calls laufen über Traefik, nicht über Container-Namen.
      # Lokal: HTTP; Prod: HTTPS (über Umgebungsvariable setzen).
      NEXT_PUBLIC_BUILDER_URL: ${NEXT_PUBLIC_BUILDER_URL:-http://builder.localhost}
      NEXT_PUBLIC_GOVERNANCE_URL: ${NEXT_PUBLIC_GOVERNANCE_URL:-http://rsd.localhost}
    ports:
      - "3000:3000"
    depends_on:
      - builder_orchestrator
      - governance_backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`app.localhost`)
      - traefik.http.routers.frontend.entrypoints=web,websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    networks:
      - rsd_net

  supabase_db:
    image: postgres:16-alpine
    container_name: rsd_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - rsd_pgdata:/var/lib/postgresql/data
      # Die Migration wendet das Backend beim Start selbst an (sie ist
      # wiederholbar). Der initdb-Hook wäre unzuverlässig, weil er nur beim
      # allerersten Start eines leeren Volumes läuft.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rsd_net

volumes:
  rsd_pgdata:
  # Generierte Anwendungsdateien. Eigenes Volume, damit ein Neustart des
  # Orchestrators die Ergebnisse nicht mitnimmt — der Task-Graph in Postgres
  # zeigt sonst auf ein leeres Verzeichnis.
  builder_workspaces:

networks:
  rsd_net:
    driver: bridge
