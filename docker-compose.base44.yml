# Base44 development compose — runs the Vite/React SPA from source with live reload.
# Supabase is external (production fallback in src/lib/supabaseUrl.ts), so no
# local database or external secrets are required to boot.
services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the preview proxy host is accepted.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
