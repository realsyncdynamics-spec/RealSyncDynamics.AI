name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'lighthouserc.json'
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse (desktop, preview)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (skip prerender — LH misst den Preview-Server)
        run: npm run build
        env:
          SKIP_PRERENDER: '1'
          VITE_BASE: '/'

      - name: Start preview
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 > preview-server.log 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173 >/dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 2
          done
          cat preview-server.log
          exit 1

      - name: Lighthouse CI autorun
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload LHCI artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-ci
          path: |
            .lighthouseci/
            preview-server.log
          if-no-files-found: ignore
          retention-days: 14
