name: Secret-Scan (gitleaks)

# AP-0.9 (28.11.2026). Prüft neue Commits in PRs und auf main, die hinzugefügten Zeilen
# im Merge-Ergebnis (auch Konfliktauflösungen) und sonntags die
# vollständige Historie. Ergebnisse sind redigiert; Werte erscheinen nie im Log.
# Werkzeug: gitleaks, Version und Modul-Hash gepinnt, Herkunft über sum.golang.org geprüft.
# Ausnahmen: nur einzelne, geprüfte Altfunde in .gitleaksignore. Bei Pull Requests
# gelten Konfiguration, Ausnahmen und Selbsttest aus dem Ziel-Branch, nicht aus dem PR.
# Inline-Ausnahmen (gitleaks:allow) wirken nicht.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 0'   # sonntags: vollständige Historie
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Nur PR-Läufe dürfen sich gegenseitig abbrechen; Push- und Wochenläufe laufen immer zu Ende.
  group: secret-scan-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: v8.30.1
  # h1-Hash des Moduls github.com/zricethezav/gitleaks/v8@v8.30.1 (sum.golang.org, geprüft 28.11.2026)
  GITLEAKS_MODULE_HASH: 'h1:PmEvCfVI7ti9dV3s5aMZUY7sS2GxRvG3yzih7E+cS3w='

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks installieren und Herkunft prüfen
        env:
          GOFLAGS: -mod=mod
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          BIN="$(go env GOPATH)/bin/gitleaks"
          got="$(go version -m "$BIN" | awk '$1=="mod" && $2=="github.com/zricethezav/gitleaks/v8" {print $3" "$4}')"
          if [ "$got" != "${GITLEAKS_VERSION} ${GITLEAKS_MODULE_HASH}" ]; then
            echo "::error::gitleaks-Modul weicht vom Pin ab: $got"; exit 1
          fi
          echo "GITLEAKS=$BIN" >> "$GITHUB_ENV"

      - name: Konfiguration festlegen (bei PRs aus dem Ziel-Branch)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          CONF="$RUNNER_TEMP/secret-scan"; mkdir -p "$CONF"
          if [ "$EVENT" = "pull_request" ] && git cat-file -e "$BASE_SHA:.gitleaks.toml" 2>/dev/null; then
            for f in .gitleaks.toml .gitleaksignore scripts/secret-scan-selftest.sh; do
              git show "$BASE_SHA:$f" > "$CONF/$(basename "$f")"
            done
            echo "::notice::Konfiguration, Ausnahmen und Selbsttest aus dem Ziel-Branch (${BASE_SHA:0:12})"
          else
            cp .gitleaks.toml .gitleaksignore scripts/secret-scan-selftest.sh "$CONF/"
          fi
          { echo "SECRET_SCAN_CONFIG=$CONF/.gitleaks.toml"; echo "SECRET_SCAN_IGNORE=$CONF/.gitleaksignore"; echo "SECRET_SCAN_SELFTEST=$CONF/secret-scan-selftest.sh"; } >> "$GITHUB_ENV"

      - name: Selbsttest (synthetische Positiv- und Negativfälle)
        run: bash "$SECRET_SCAN_SELFTEST"

      - name: Prüfbereich bestimmen
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) echo "opts=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT" ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$PUSH_BEFORE" 2>/dev/null; then
                echo "opts=--all" >> "$GITHUB_OUTPUT"
              else
                echo "opts=${PUSH_BEFORE}..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
              fi ;;
            *) echo "opts=--all" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Scan der Commits (redigiert)
        env:
          LOG_OPTS: ${{ steps.range.outputs.opts }}
        run: |
          set -euo pipefail
          "$GITLEAKS" git --no-banner --redact --ignore-gitleaks-allow --config "$SECRET_SCAN_CONFIG" \
            --gitleaks-ignore-path "$SECRET_SCAN_IGNORE" --log-opts="$LOG_OPTS" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-git.json" --exit-code 1 .

      - name: Scan der hinzugefügten Zeilen im Merge-Ergebnis (redigiert)
        # Erfasst auch Inhalte, die erst bei der Konfliktauflösung oder im Merge-Commit entstehen.
        # Geprüft werden nur neu hinzugefügte Zeilen; bestehende, geprüfte Altfunde bleiben außen vor.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::notice::Keine Vergleichsbasis; der Commit-Scan deckt die gesamte Historie ab."; exit 0
          fi
          { git diff --unified=0 --no-color --no-ext-diff "$BASE" "$HEAD_SHA" | grep -E '^\+' | grep -vE '^\+\+\+ ' || true; } \
            | "$GITLEAKS" stdin --no-banner --redact --ignore-gitleaks-allow --config "$SECRET_SCAN_CONFIG" \
                --report-format json --report-path "$RUNNER_TEMP/gitleaks-diff.json" --exit-code 1

      - name: Redigierten Bericht sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report-redigiert
          path: ${{ runner.temp }}/gitleaks-*.json
          retention-days: 14
