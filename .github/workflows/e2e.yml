name: E2E Tests (Playwright)

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # CI testet den PR-eigenen Build über einen lokalen Preview-Server.
      # Die Live-Produktion ist als Ziel ungeeignet: ihr Bot-Schutz liefert
      # dem headless-Browser 403. Für manuelle Läufe gegen Live/Staging:
      #   TEST_BASE_URL=https://… npm run test:e2e
      TEST_BASE_URL: ${{ secrets.TEST_BASE_URL || 'http://localhost:4173' }}
      STRIPE_TEST_MODE: 'true'
      TEST_EMAIL: ${{ secrets.TEST_EMAIL || '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          # Dummy-Pixel-IDs, damit die Consent-Gating-Tests in
          # e2e/cookie-consent.spec.ts wirklich messen können. `pixels.ts` lädt
          # die Pixel nur bei gesetzten IDs — ohne sie feuert auch nach einer
          # Einwilligung nichts, und „vor Consent: 0 Requests" wäre trivial
          # erfüllt, selbst wenn das Gating kaputt wäre. Die Tests erkennen das
          # und überspringen sich dann; mit diesen Werten laufen sie scharf.
          #
          # Die IDs sind bewusst ungültig und gehören zu keinem echten Konto.
          # Der Test bricht die Tracker-Requests zudem ab, bevor sie das Netz
          # erreichen — es geht nichts an Google, Meta oder TikTok raus.
          VITE_GA4_MEASUREMENT_ID: G-E2ETEST0000
          VITE_META_PIXEL_ID: '000000000000000'

      - name: Install Playwright Browsers
        # `--with-deps` ruft im Hintergrund `apt-get` gegen die Ubuntu-Spiegel.
        # Genau dort hingen am 2026-08-19 zwei Laeufe bis zum Job-Timeout: Das
        # Log endet mitten in `apt-get update` mit `Ign:` fuer jedes Repository,
        # danach 28 Minuten Stille, und `playwright-report/` blieb leer — es lief
        # kein einziger Test. Auffaellig war, dass ausschliesslich die zwei Jobs
        # mit diesem Schritt hingen, alle uebrigen liefen gruen durch.
        #
        # Das Runner-Image `ubuntu-latest` bringt die Systembibliotheken fuer
        # Chromium bereits mit (Chrome ist vorinstalliert). Der apt-Lauf sichert
        # hier also gegen ein Risiko ab, das nicht besteht — und schafft dabei
        # ein neues.
        #
        # `timeout-minutes` bleibt als Netz: Haengt der Download doch einmal,
        # faellt der Job nach sechs Minuten mit einer lesbaren Meldung aus,
        # statt eine halbe Stunde still zu blockieren.
        timeout-minutes: 6
        run: npx playwright install chromium

      - name: Start Preview Server
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 > preview-server.log 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Preview Server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then
              echo "Preview-Server ist erreichbar."
              exit 0
            fi
            sleep 2
          done
          echo "Preview-Server nicht erreichbar — Log:"; cat preview-server.log
          exit 1

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
