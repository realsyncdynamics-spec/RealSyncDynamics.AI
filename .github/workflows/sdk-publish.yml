name: SDK Publish to NPM

on:
  push:
    tags:
      - 'sdk-v*'
    paths:
      - 'packages/sdk/**'
      - '.github/workflows/sdk-publish.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true

env:
  NODE_VERSION: '20'
  REGISTRY_URL: 'https://registry.npmjs.org'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/sdk

      - name: Lint
        run: npm run lint
        working-directory: packages/sdk
        continue-on-error: true

      - name: Build
        run: npm run build
        working-directory: packages/sdk

      - name: Run tests
        run: npm test
        working-directory: packages/sdk
        continue-on-error: true

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Install dependencies
        run: npm ci
        working-directory: packages/sdk

      - name: Build
        run: npm run build
        working-directory: packages/sdk

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        working-directory: packages/sdk

      - name: Publish to NPM
        run: npm publish --access public
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: sdk-v${{ steps.version.outputs.version }}
          release_name: RealSyncDynamics SDK v${{ steps.version.outputs.version }}
          body: |
            # SDK v${{ steps.version.outputs.version }} Released

            ## Installation
            ```bash
            npm install @realsyncdynamics/sdk
            ```

            ## What's Changed
            - See [changelog](https://github.com/realsyncdynamics/RealSyncDynamics.AI/blob/main/packages/sdk/README.md)

            ## Documentation
            - [API Reference](https://docs.realsyncdynamicsai.de)
            - [Examples](https://github.com/realsyncdynamics/RealSyncDynamics.AI/tree/main/packages/sdk/examples)
            - [GitHub Repository](https://github.com/realsyncdynamics/sdk-ts)

            Published by: GitHub Actions
            Timestamp: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ SDK published to npm as @realsyncdynamics/sdk@${{ steps.version.outputs.version }}'
            })
