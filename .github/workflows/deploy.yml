name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy edge functions?'
        type: boolean
        default: false

jobs:
  db-push:
    name: Push migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      # Frueher: "supabase db push --include-all 2>&1 || true" — das hat JEDEN
      # Migrationsfehler still verschluckt (Job blieb gruen). Genau das hat den
      # P0a-Constraint-Fehler zunaechst unsichtbar gemacht.
      #
      # Eine spaetere Zwischenstufe erfasste den Exit-Code zwar als ::error +
      # Step-Summary, liess den Job aber NICHT hart fehlschlagen — eine
      # ::error::-Annotation allein faellt den Job nicht, nur ein Exit-Code != 0.
      # Damit blieb der Job gruen, obwohl KEINE Migration deployt wurde
      # (P0.2 / 20260626000000 erreichte Prod nie).
      #
      # Neu: bei jedem db-push-Fehler exit != 0 -> der Job faellt hart. Solange
      # der Remote-Ledger-Drift (Orphan-Version 20260510, siehe
      # docs/infra/migration-drift.md) nicht reconciled ist, schlaegt dieser Job
      # bewusst fehl — das ist der ehrliche Zustand: Migrationen deployen derzeit
      # NICHT. functions-deploy laeuft unabhaengig (kein needs) weiter.
      - name: Push migrations
        run: |
          set +e
          supabase db push --include-all 2>&1 | tee /tmp/db-push.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::supabase db push exited with code $code — Migration nicht sauber durchgelaufen (siehe Log)."
            echo "## db push fehlgeschlagen (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 /tmp/db-push.log >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          else
            echo "db push erfolgreich" >> "$GITHUB_STEP_SUMMARY"
          fi

  functions-deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

  post-deploy-validation:
    name: Validate deployment
    runs-on: ubuntu-latest
    needs: [db-push, functions-deploy]
    if: always()  # Run regardless of previous job status
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Validate post-deploy state
        run: |
          if [ "${{ needs.db-push.result }}" = "failure" ]; then
            echo "⚠️  Skipping validation: db-push failed (likely due to migration drift)"
            echo "See migration-drift.md for recovery instructions"
            exit 0
          fi
          node scripts/validate-supabase-state.mjs 2>&1 | tee /tmp/validation.log || {
            echo "## ❌ Post-Deploy Validation Failed" >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 /tmp/validation.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database migrations: deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Edge functions: deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Post-deploy validation: passed" >> "$GITHUB_STEP_SUMMARY"
