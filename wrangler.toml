# Cloudflare Pages deployment config (modernes Pages-Format).
#
# Pages erwartet `pages_build_output_dir` (anstelle von Legacy-Fields).
# Build laeuft in CI (npm run build → dist/), deployt via
# `wrangler pages deploy dist` (siehe .github/workflows/deploy-cloudflare-pages.yml).
#
# ─── WICHTIG: Build-Befehl der Git-Integration ──────────────────────────────
# Der Live-Deploy laeuft ueber Cloudflares Git-Integration, deren Build-Befehl
# NUR im Cloudflare-Dashboard konfigurierbar ist (nicht in dieser Datei):
#
#   Workers & Pages → realsyncdynamics-ai → Settings → Build → Build command
#
# Dort muss `npm run build:full` stehen, NICHT `npm run build`.
#
# Grund: nur `build:full` ruft `scripts/prerender.mjs` auf und erzeugt echtes
# statisches HTML pro Route (dist/<route>/index.html). Mit blossem
# `npm run build` greift fuer jede URL die Regel `/*  /index.html  200` aus
# public/_redirects — Crawler ohne JS-Ausfuehrung sehen dann auf KEINER Seite
# Inhalt, auch nicht auf /impressum. Das war bis 2026-08 der Live-Zustand.
#
# Faellt der Prerender im Build-Image aus (kein Chromium), bricht der Deploy
# nicht ab: prerender.mjs installiert Chromium einmalig nach und faellt sonst
# mit lauter Warnung auf den bisherigen SPA-Shell-Zustand zurueck (Exit 0).
# Mit PRERENDER_STRICT=1 wird derselbe Fall stattdessen hart zum Fehler.
#
# Secrets Management:
# - Pages: Env vars via GitHub Actions → VITE_* env vars
# - Workers: Secrets via `wrangler secret put KEY --env production`
#   (sensitive keys: ANTHROPIC_API_KEY, STRIPE_SECRET_KEY, etc.)
#
# NOTE: Future Cloudflare Workers configuration (Phase B1+)
# will be added in a separate wrangler-workers.toml file.
# This file is optimized for Pages-only deployments.

name = "realsyncdynamics-ai"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-23"
