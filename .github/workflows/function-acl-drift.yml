name: Function ACL Drift Guard

# Faengt ACL-Drift auf public-Funktionen ab: der Vorfall vom 2026-08-23
# (Out-of-Band-Bulk-REVOKE, "permission denied for function is_tenant_member"
# auf /welcome) blieb unsichtbar, weil Migrations- und Function-Existenz-Drift
# gedeckt waren, die EXECUTE-Grants aber niemand pruefte.
# Kontext: CLAUDE.md §5 (ACL-Vorfall 2026-08-23), Migration 20260826000001.

on:
  schedule:
    - cron: '30 6 * * *'   # taeglich 06:30 UTC, nach dem Migration Drift Guard
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-function-acl-drift.mjs'
      - '.github/workflows/function-acl-drift.yml'

# Eng gefasst: Der Waechter liest den Stand und schreibt genau ein
# Alarm-Issue. Keine weiteren Rechte.
permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Check function ACL drift
        id: guard
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          # Wie beim Migration Drift Guard: Drift beschreibt den Zustand der
          # PROD-DB, nicht die Qualitaet des Diffs — auf PRs advisory, im
          # taeglichen schedule-Lauf hart.
          FUNCTION_ACL_DRIFT_MODE: ${{ github.event_name == 'pull_request' && 'advisory' || 'fail' }}
        run: node scripts/check-function-acl-drift.mjs

      # Der Waechter meldet ab hier dorthin, wo jemand hinsieht.
      #
      # Wie beim Migration Drift Guard steht das harte Signal allein im
      # `schedule`-Lauf, auf PRs ist er `advisory`. Dass genau diese
      # Aufteilung ein Signal verschluckt, hat sich am 2026-08-29 gezeigt:
      # Der Migration Drift Guard war vier Morgen in Folge rot, ohne dass es
      # jemandem auffiel. Diese Meldung schliesst die Luecke fuer alle drei.
      #
      # Nur im `schedule`-Lauf, und `always()`, damit auch der gruene Fall
      # ankommt: Er schliesst das Issue wieder.
      - name: Drift-Alarm melden
        if: always() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARD_KEY: function-acl
          GUARD_TITLE: Function ACL Drift Guard
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-drift-alarm.mjs ${{ steps.guard.outcome == 'failure' && 'alarm' || 'resolve' }}

      - name: Ergebnis des Wächters durchreichen
        if: always() && github.event_name == 'schedule' && steps.guard.outcome == 'failure'
        run: |
          echo "Der Wächter hat Drift gemeldet — siehe Schritt oben und das Drift-Alarm-Issue."
          exit 1
