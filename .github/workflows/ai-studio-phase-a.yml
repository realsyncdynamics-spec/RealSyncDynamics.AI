name: AI Studio Phase A
on:
  pull_request:
    paths:
      - 'src/features/ai-studio/**'
      - 'test/ai-studio/**'
      - '.github/workflows/ai-studio-phase-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-a:
    name: AI Studio unit and full Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript lint
        run: npm run lint
      - name: Studio regression tests
        run: npx vitest run test/ai-studio/playground.test.tsx
      - name: Full Vitest suite
        run: npm run test
