name: VPS Backup

# The application production path is Cloudflare Pages. This backup remains
# available for the Hostinger VPS because /opt/realsync/deploy may still carry
# operational state, but the VPS is currently not reachable from GitHub
# runners over SSH. Do not report a red scheduled workflow for an unavailable
# secondary target.
#
# Set repository variable VPS_BACKUP_ENABLED=true only after SSH connectivity
# has been restored and verified. Until then the scheduled run is intentionally
# paused and emits a successful, explicit status.
#
# Required repo secrets when enabled:
#   VPS_SSH_HOST
#   VPS_SSH_USER
#   VPS_SSH_KEY
#   VPS_SSH_KNOWN_HOST
#   VPS_SSH_PORT (optional; defaults to 22)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: vps-backup
  cancel-in-progress: false

jobs:
  paused:
    name: VPS backup paused
    if: vars.VPS_BACKUP_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain paused state
        run: |
          echo "VPS backup is intentionally paused."
          echo "The Hostinger VPS is not currently reachable from GitHub runners over SSH."
          echo "Set repository variable VPS_BACKUP_ENABLED=true only after SSH connectivity is restored."
          {
            echo "## VPS backup paused"
            echo ""
            echo "The backup target is currently unavailable over SSH."
            echo "No backup is claimed to have been created."
            echo ""
            echo "Re-enable with repository variable \\`VPS_BACKUP_ENABLED=true\\` after the SSH path is verified."
          } >> "$GITHUB_STEP_SUMMARY"

  backup:
    name: Backup VPS
    if: vars.VPS_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify required secrets
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOST: ${{ secrets.VPS_SSH_KNOWN_HOST }}
        run: |
          for v in VPS_SSH_HOST VPS_SSH_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOST; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v is not set"
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOST: ${{ secrets.VPS_SSH_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          if ! timeout 15 bash -c "</dev/tcp/${VPS_SSH_HOST}/${VPS_SSH_PORT}" 2>/dev/null; then
            echo "::error::VPS ${VPS_SSH_HOST}:${VPS_SSH_PORT} is not reachable from the GitHub runner."
            echo "Check Hostinger firewall/sshd and VPS_SSH_PORT before retrying."
            exit 1
          fi
          echo "✓ VPS SSH port is reachable."

      - name: Run backup script on VPS
        env:
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          scp -P "$VPS_SSH_PORT" -i ~/.ssh/id_ed25519 \
            scripts/vps-backup.sh \
            "$VPS_SSH_USER@$VPS_SSH_HOST:/tmp/vps-backup.sh"
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/id_ed25519 \
            "$VPS_SSH_USER@$VPS_SSH_HOST" \
            "chmod +x /tmp/vps-backup.sh && /tmp/vps-backup.sh"
